<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlucky Draw</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@600;800&family=Creepster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --obsidian: #0d0d0d;
            --obsidian-2: #140818;
            --crimson: #ff1e38;
            --crimson-dim: #9b1024;
            --void: #3a005c;
            --void-glow: #7b1fa2;
            --glitch: #00ffc8;
            --glitch-2: #39ff14;
            --ash: #c8c2d4;
            --muted: #7a7388;
            --frame: rgba(255, 30, 56, 0.45);
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Orbitron', sans-serif;
            color: var(--ash);
            background:
                radial-gradient(circle at 50% 18%, rgba(58, 0, 92, 0.45), transparent 42%),
                radial-gradient(circle at 20% 80%, rgba(255, 30, 56, 0.12), transparent 40%),
                radial-gradient(circle at 80% 75%, rgba(0, 255, 200, 0.05), transparent 35%),
                linear-gradient(180deg, #050308 0%, var(--obsidian) 45%, #09040f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.85rem;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.12) 2px,
                    rgba(0, 0, 0, 0.12) 4px
                );
            opacity: 0.35;
            z-index: 0;
            animation: scan 8s linear infinite;
        }
        @keyframes scan {
            from { transform: translateY(0); }
            to { transform: translateY(4px); }
        }
        body.is-shaking {
            animation: screen-shake 0.55s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes screen-shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(3px, 1px, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, -2px, 0); }
            40%, 60% { transform: translate3d(5px, 2px, 0); }
        }

        .shell {
            width: min(100%, 460px);
            position: relative;
            z-index: 1;
            background:
                linear-gradient(165deg, rgba(28, 8, 36, 0.96), rgba(10, 6, 14, 0.98));
            border: 2px solid var(--frame);
            border-radius: 22px;
            box-shadow:
                0 0 0 1px rgba(58, 0, 92, 0.5),
                0 0 40px rgba(255, 30, 56, 0.18),
                0 0 80px rgba(58, 0, 92, 0.25),
                inset 0 0 60px rgba(0, 0, 0, 0.45);
            padding: 1.15rem 1.2rem 1.3rem;
            text-align: center;
            overflow: hidden;
        }
        .shell::before {
            content: '';
            position: absolute;
            inset: -20%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 30, 56, 0.12), transparent 40%, rgba(58, 0, 92, 0.18), transparent 70%);
            animation: aura-spin 10s linear infinite;
            opacity: 0.7;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes aura-spin { to { transform: rotate(360deg); } }
        .shell > * { position: relative; z-index: 1; }

        .title {
            font-family: 'Creepster', cursive;
            font-size: clamp(1.7rem, 6vw, 2.35rem);
            letter-spacing: 0.04em;
            color: var(--crimson);
            text-shadow:
                0 0 12px rgba(255, 30, 56, 0.7),
                0 0 28px rgba(58, 0, 92, 0.8),
                0 2px 0 #3a0008;
            margin: 0.15rem 0 0.2rem;
            line-height: 1.1;
        }
        .subtitle {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.48rem;
            color: var(--muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 0.85rem;
        }
        .class-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid rgba(255, 30, 56, 0.35);
            background: rgba(0, 0, 0, 0.35);
            color: var(--ash);
            border-radius: 999px;
            padding: 0.28rem 0.7rem;
            font-size: 0.72rem;
            font-weight: 700;
            margin-bottom: 0.85rem;
        }
        .class-pill i { color: var(--crimson); }

        .status-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.55rem;
            margin-bottom: 0.85rem;
        }
        .stat {
            border: 1px solid rgba(123, 31, 162, 0.45);
            background: rgba(0, 0, 0, 0.45);
            border-radius: 14px;
            padding: 0.55rem 0.45rem;
            min-height: 3.2rem;
        }
        .stat-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.42rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            margin-bottom: 0.35rem;
        }
        .stat-value {
            font-size: 1.15rem;
            font-weight: 800;
            color: #fff;
        }
        .stat-value.dollars { color: var(--glitch-2); text-shadow: 0 0 10px rgba(57, 255, 20, 0.35); }
        .stat-value.tickets { color: #ff8fa3; text-shadow: 0 0 10px rgba(255, 30, 56, 0.35); }
        .stat-value.draining {
            animation: drain-glitch 0.45s steps(3) infinite;
            color: var(--crimson);
        }
        @keyframes drain-glitch {
            0% { transform: translate(0, 0); filter: none; }
            33% { transform: translate(-2px, 1px); filter: hue-rotate(40deg); }
            66% { transform: translate(2px, -1px); text-shadow: 2px 0 var(--glitch), -2px 0 var(--crimson); }
        }

        .student-row {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            margin-bottom: 0.9rem;
            text-align: left;
        }
        .student-row label {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.42rem;
            color: var(--muted);
            letter-spacing: 0.06em;
        }
        .student-row select {
            width: 100%;
            border-radius: 12px;
            border: 1px solid rgba(255, 30, 56, 0.35);
            background: #120814;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.92rem;
            padding: 0.65rem 0.75rem;
            outline: none;
        }
        .student-row select:focus {
            border-color: var(--crimson);
            box-shadow: 0 0 0 2px rgba(255, 30, 56, 0.2);
        }

        .portal-wrap {
            position: relative;
            margin: 0.4rem auto 0.95rem;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 1 / 1.05;
            display: grid;
            place-items: center;
            overflow: hidden;
        }
        .portal-ring {
            position: absolute;
            inset: 4%;
            border-radius: 50%;
            border: 3px solid rgba(255, 30, 56, 0.55);
            box-shadow:
                0 0 24px rgba(255, 30, 56, 0.35),
                0 0 60px rgba(58, 0, 92, 0.55),
                inset 0 0 40px rgba(0, 0, 0, 0.85);
            animation: portal-pulse 2.4s ease-in-out infinite;
            z-index: 1;
            pointer-events: none;
        }
        .portal-ring::after {
            content: '';
            position: absolute;
            inset: 10%;
            border-radius: 50%;
            border: 1px dashed rgba(0, 255, 200, 0.25);
            animation: aura-spin 18s linear infinite reverse;
        }
        @keyframes portal-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 30, 56, 0.3), 0 0 50px rgba(58, 0, 92, 0.45), inset 0 0 40px rgba(0, 0, 0, 0.85); }
            50% { box-shadow: 0 0 34px rgba(255, 30, 56, 0.55), 0 0 80px rgba(58, 0, 92, 0.7), inset 0 0 50px rgba(0, 0, 0, 0.9); }
        }
        #voidCanvas {
            position: absolute;
            inset: 8%;
            width: 84%;
            height: 84%;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
        }
        /* Circular viewport — clips the spinning list on desktop + iPad/Safari */
        .portal-mask {
            position: absolute;
            inset: 8%;
            border-radius: 50%;
            overflow: hidden;
            z-index: 3;
            display: grid;
            place-items: center;
            transform: translateZ(0);
            -webkit-mask-image: radial-gradient(closest-side, #000 99.5%, transparent 100%);
            mask-image: radial-gradient(closest-side, #000 99.5%, transparent 100%);
        }
        .stage {
            position: relative;
            z-index: 3;
            width: 86%;
            height: 64%;
            max-width: 100%;
            max-height: 100%;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            display: grid;
            place-items: stretch;
            perspective: 700px;
        }

        .idle-hint, .warn-banner, .result-banner {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.52rem;
            line-height: 1.55;
            color: var(--ash);
            padding: 0.7rem;
            max-width: 90%;
            align-self: center;
            justify-self: center;
        }
        .warn-banner {
            color: #ffb4bf;
            text-shadow: 0 0 10px rgba(255, 30, 56, 0.5);
            animation: flicker 0.9s steps(2) infinite;
        }
        @keyframes flicker {
            50% { opacity: 0.72; }
        }
        .result-banner {
            color: var(--crimson);
            font-size: 0.58rem;
            text-shadow: 0 0 14px rgba(255, 30, 56, 0.8);
        }
        .result-banner.consume {
            color: #d7b3ff;
            text-shadow: 0 0 14px rgba(123, 31, 162, 0.9);
        }

        .reel-window {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            max-height: 100%;
            overflow: hidden;
            border-radius: 16px;
            border: 2px solid rgba(255, 30, 56, 0.4);
            background: rgba(0, 0, 0, 0.72);
            box-shadow: inset 0 0 28px rgba(255, 30, 56, 0.12);
            position: relative;
            contain: paint;
            transform: translateZ(0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        .reel-window::before,
        .reel-window::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 28%;
            z-index: 2;
            pointer-events: none;
        }
        .reel-window::before {
            top: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.85), transparent);
        }
        .reel-window::after {
            bottom: 0;
            background: linear-gradient(0deg, rgba(0,0,0,0.85), transparent);
        }
        .reel-pointer {
            position: absolute;
            left: 0; right: 0;
            top: 50%;
            height: 56px;
            margin-top: -28px;
            border-top: 1px solid rgba(0, 255, 200, 0.45);
            border-bottom: 1px solid rgba(0, 255, 200, 0.45);
            background: rgba(0, 255, 200, 0.05);
            z-index: 3;
            pointer-events: none;
        }
        .reel-strip {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        .reel-item {
            height: 56px;
            flex: 0 0 56px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.15rem;
            padding: 0 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: #fff;
        }
        .reel-item .tier {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.38rem;
            color: var(--glitch);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .reel-item .title-text {
            font-size: 0.78rem;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .reel-item.dollar-item .title-text {
            font-size: 1.15rem;
            color: var(--crimson);
            text-shadow: 0 0 12px rgba(255, 30, 56, 0.7);
        }

        .reel-window.is-landed {
            border-color: rgba(255, 30, 56, 0.85);
            box-shadow:
                inset 0 0 28px rgba(255, 30, 56, 0.18),
                0 0 22px rgba(255, 30, 56, 0.45);
            animation: landed-glow 0.9s ease-in-out infinite alternate;
        }
        @keyframes landed-glow {
            from { box-shadow: inset 0 0 20px rgba(255, 30, 56, 0.12), 0 0 14px rgba(255, 30, 56, 0.3); }
            to { box-shadow: inset 0 0 34px rgba(255, 30, 56, 0.28), 0 0 28px rgba(123, 31, 162, 0.55); }
        }
        .reel-item.is-chosen {
            background: linear-gradient(90deg, rgba(255, 30, 56, 0.22), rgba(58, 0, 92, 0.35), rgba(255, 30, 56, 0.22));
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 30, 56, 0.7);
        }
        .reel-item.is-chosen .tier { color: #ff8fa3; }

        .ticket-card {
            width: min(92%, 250px);
            min-height: 120px;
            border-radius: 16px;
            border: 2px solid rgba(255, 143, 163, 0.55);
            background:
                linear-gradient(145deg, rgba(70, 10, 30, 0.95), rgba(20, 4, 12, 0.98));
            box-shadow: 0 0 24px rgba(255, 30, 56, 0.35);
            padding: 0.9rem 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.35rem;
            transform-origin: center;
            position: relative;
            z-index: 4;
            align-self: center;
            justify-self: center;
        }
        .ticket-card .tier {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.42rem;
            color: var(--glitch);
            letter-spacing: 0.1em;
        }
        .ticket-card .prize {
            font-size: 1rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.25;
        }
        .ticket-card.is-held {
            animation: held-pulse 1.1s ease-in-out infinite alternate;
        }
        @keyframes held-pulse {
            from { transform: scale(1); box-shadow: 0 0 18px rgba(255, 30, 56, 0.3); }
            to { transform: scale(1.03); box-shadow: 0 0 32px rgba(255, 30, 56, 0.55), 0 0 48px rgba(123, 31, 162, 0.35); }
        }
        .ticket-card.is-flashing {
            animation: death-flash 0.16s steps(2) infinite;
        }
        @keyframes death-flash {
            0% { filter: none; border-color: #ff1e38; }
            50% { filter: invert(0.15) saturate(2); border-color: #7b1fa2; box-shadow: 0 0 30px #7b1fa2; }
            100% { filter: hue-rotate(80deg); border-color: #00ffc8; }
        }
        .shatter-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 6;
            overflow: visible;
        }
        .shard {
            position: absolute;
            border: 1px solid rgba(255, 143, 163, 0.55);
            background: linear-gradient(145deg, rgba(90, 12, 36, 0.95), rgba(20, 4, 12, 0.98));
            box-shadow: 0 0 8px rgba(255, 30, 56, 0.45);
            opacity: 1;
            will-change: transform, opacity;
        }
        .ticket-card.is-vanish {
            opacity: 0 !important;
            pointer-events: none;
        }

        .shield-scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            overflow: hidden;
        }
        .shield-stack {
            position: absolute;
            inset: 12% 18% 28%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            z-index: 2;
            pointer-events: none;
        }
        .shield-mini {
            width: 42px;
            height: 56px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 200, 0.35);
            background: linear-gradient(160deg, rgba(40, 60, 80, 0.9), rgba(12, 18, 28, 0.95));
            box-shadow: 0 0 10px rgba(0, 255, 200, 0.2);
            opacity: 0.85;
            transform: scale(0.92);
        }
        .shield-mini.is-safe {
            animation: shield-safe-glow 0.7s ease-in-out infinite alternate;
            border-color: rgba(57, 255, 20, 0.7);
        }
        @keyframes shield-safe-glow {
            from { box-shadow: 0 0 8px rgba(57, 255, 20, 0.25); transform: scale(0.92); }
            to { box-shadow: 0 0 18px rgba(57, 255, 20, 0.55); transform: scale(0.98); }
        }
        .ticket-card.shield-hero {
            z-index: 5;
            border-color: rgba(0, 255, 200, 0.85);
            background: linear-gradient(145deg, rgba(8, 60, 70, 0.96), rgba(6, 20, 40, 0.98));
            box-shadow:
                0 0 28px rgba(0, 255, 200, 0.45),
                0 0 60px rgba(57, 255, 20, 0.2);
            animation: shield-rise 0.55s cubic-bezier(0.2, 1.3, 0.4, 1) both;
        }
        @keyframes shield-rise {
            from { transform: scale(0.7) translateY(18px); opacity: 0.2; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .ticket-card.shield-hero.is-guarding {
            animation: shield-guard-pulse 0.55s ease-in-out infinite alternate;
        }
        @keyframes shield-guard-pulse {
            from { box-shadow: 0 0 22px rgba(0, 255, 200, 0.4), 0 0 40px rgba(57, 255, 20, 0.15); }
            to { box-shadow: 0 0 40px rgba(0, 255, 200, 0.75), 0 0 70px rgba(57, 255, 20, 0.35); transform: scale(1.04); }
        }
        .shield-dome {
            position: absolute;
            width: 78%;
            height: 78%;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 200, 0.55);
            box-shadow:
                0 0 24px rgba(0, 255, 200, 0.35),
                inset 0 0 30px rgba(57, 255, 20, 0.12);
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.6);
        }
        .shield-dome.show {
            animation: shield-dome-pop 0.7s cubic-bezier(0.2, 1.2, 0.4, 1) forwards;
        }
        @keyframes shield-dome-pop {
            0% { opacity: 0; transform: scale(0.55); }
            40% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.85; transform: scale(1); }
        }
        .shield-dome.is-hit {
            animation: shield-dome-hit 0.45s ease-out;
        }
        @keyframes shield-dome-hit {
            0% { transform: scale(1); border-color: rgba(0, 255, 200, 0.7); }
            35% { transform: scale(1.12); border-color: #fff; box-shadow: 0 0 40px #39ff14; }
            100% { transform: scale(1); border-color: rgba(0, 255, 200, 0.55); }
        }
        .void-bolt {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff1e38, #7b1fa2 60%, transparent 70%);
            box-shadow: 0 0 16px #ff1e38;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
        }
        .result-banner.shield {
            color: #39ff14;
            text-shadow: 0 0 12px rgba(57, 255, 20, 0.65);
            background: linear-gradient(90deg, rgba(0, 80, 60, 0.35), rgba(0, 40, 50, 0.5), rgba(0, 80, 60, 0.35));
            border-color: rgba(0, 255, 200, 0.45);
        }

        .execute-btn {
            width: 100%;
            border: 0;
            border-radius: 16px;
            padding: 1rem 0.75rem;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.62rem;
            letter-spacing: 0.04em;
            color: #fff;
            cursor: pointer;
            background:
                linear-gradient(180deg, #ff3a52 0%, #b01028 55%, #6a0614 100%);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.08),
                0 0 28px rgba(255, 30, 56, 0.45),
                0 6px 0 #4a020c;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
            transition: transform 0.12s, filter 0.12s, box-shadow 0.12s;
        }
        .execute-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.1),
                0 0 40px rgba(255, 30, 56, 0.65),
                0 8px 0 #4a020c;
        }
        .execute-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.08),
                0 0 18px rgba(255, 30, 56, 0.35),
                0 2px 0 #4a020c;
        }
        .execute-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            filter: grayscale(0.4);
            box-shadow: none;
        }

        .status-line {
            min-height: 1.2rem;
            margin-top: 0.7rem;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.42rem;
            color: var(--muted);
            letter-spacing: 0.04em;
            line-height: 1.5;
        }
        .status-line.error { color: var(--crimson); }
        .status-line.ok { color: var(--glitch); }

        .ticket-list {
            margin-top: 0.75rem;
            text-align: left;
            max-height: 110px;
            overflow: auto;
            border-radius: 12px;
            border: 1px solid rgba(123, 31, 162, 0.35);
            background: rgba(0, 0, 0, 0.35);
            padding: 0.4rem 0.55rem;
        }
        .ticket-list:empty { display: none; }
        .ticket-chip {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            font-size: 0.72rem;
            padding: 0.28rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #ddd;
        }
        .ticket-chip:last-child { border-bottom: 0; }
        .ticket-chip .t { color: var(--glitch); font-size: 0.65rem; text-transform: uppercase; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="shell">
        <h1 class="title">Unlucky Draw</h1>
        <div class="subtitle">Homework Failed · Sacrifice Required</div>
        <div class="class-pill"><i class="fa-solid fa-skull"></i> <span id="classNameLabel">Class</span></div>

        <div class="status-bar">
            <div class="stat">
                <div class="stat-label">Dollars</div>
                <div class="stat-value dollars" id="dollarStat">—</div>
            </div>
            <div class="stat">
                <div class="stat-label">Tickets</div>
                <div class="stat-value tickets" id="ticketStat">—</div>
            </div>
        </div>

        <div class="student-row">
            <label for="studentSelect">Choose the unlucky student</label>
            <select id="studentSelect">
                <option value="">Loading students…</option>
            </select>
        </div>

        <div class="portal-wrap" id="portalWrap">
            <div class="portal-ring" aria-hidden="true"></div>
            <canvas id="voidCanvas" width="360" height="360" aria-hidden="true"></canvas>
            <div class="portal-mask">
                <div class="stage" id="stage">
                    <div class="idle-hint" id="idleHint">Select a student.<br>Then execute the penalty.</div>
                </div>
            </div>
        </div>

        <button type="button" class="execute-btn" id="executeBtn" disabled>
            [ EXECUTE PENALTY ]
        </button>
        <div class="status-line" id="statusLine"></div>
        <div class="ticket-list" id="ticketList"></div>
    </div>

    <script>
    (function() {
        var CLASS_ID = <?!= JSON.stringify(classId || '') ?>;
        var CLASS_NAME = <?!= JSON.stringify(className || 'Class') ?>;
        var STUDENTS = <?!= studentsJson ?>;
        var NODE_API = <?!= JSON.stringify(nodeApiUrl || '') ?>;

        var ITEM_H = 56;
        var state = 'idle'; // idle | loading | spinning | landed | destroying | finished
        var dollars = 0;
        var tickets = [];
        var audioCtx = null;
        var particles = [];
        var particleAnim = null;
        var collapseMode = false;

        var stage = document.getElementById('stage');
        var executeBtn = document.getElementById('executeBtn');
        var studentSelect = document.getElementById('studentSelect');
        var statusLine = document.getElementById('statusLine');
        var dollarStat = document.getElementById('dollarStat');
        var ticketStat = document.getElementById('ticketStat');
        var ticketList = document.getElementById('ticketList');
        var canvas = document.getElementById('voidCanvas');
        var ctx = canvas.getContext('2d');

        document.getElementById('classNameLabel').textContent = CLASS_NAME || 'Class';

        function toolFetch(url, opts) {
            opts = opts || {};
            opts.credentials = 'same-origin';
            var headers = opts.headers || {};
            try {
                var token = localStorage.getItem('mrpark_teacher_token') || '';
                if (token) headers.Authorization = 'Bearer ' + token;
            } catch (e) { /* ignore */ }
            opts.headers = headers;
            return fetch(url, opts);
        }

        function ensureAudio() {
            if (audioCtx) return audioCtx;
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            audioCtx = new AC();
            return audioCtx;
        }

        function playTone(freq, dur, type, gainVal, slideTo) {
            var ctxA = ensureAudio();
            if (!ctxA) return;
            var now = ctxA.currentTime;
            var osc = ctxA.createOscillator();
            var gain = ctxA.createGain();
            osc.type = type || 'sawtooth';
            osc.frequency.setValueAtTime(freq, now);
            if (slideTo != null) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + dur);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(gainVal || 0.12, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
            osc.connect(gain);
            gain.connect(ctxA.destination);
            osc.start(now);
            osc.stop(now + dur + 0.02);
        }

        function sfxBoom() {
            playTone(55, 0.45, 'sine', 0.22, 28);
            playTone(90, 0.35, 'triangle', 0.08, 40);
        }
        function sfxTick() {
            playTone(880 + Math.random() * 220, 0.04, 'square', 0.035);
        }
        function sfxShatter() {
            playTone(420, 0.18, 'sawtooth', 0.12, 90);
            playTone(1200, 0.25, 'square', 0.06, 200);
            playTone(40, 0.7, 'sine', 0.18, 18);
        }
        function sfxShield() {
            playTone(523.25, 0.28, 'triangle', 0.11);
            playTone(659.25, 0.32, 'triangle', 0.09);
            playTone(783.99, 0.4, 'sine', 0.08);
        }
        function sfxShieldBreak() {
            playTone(880, 0.14, 'square', 0.08, 220);
            playTone(90, 0.55, 'sine', 0.14, 40);
        }

        function setStatus(msg, kind) {
            statusLine.textContent = msg || '';
            statusLine.className = 'status-line' + (kind ? ' ' + kind : '');
        }

        function notifyParent(payload) {
            try {
                if (!window.opener || window.opener.closed) return;
                window.opener.postMessage(Object.assign({
                    type: 'mrpark-lucky-draw-update',
                    classId: CLASS_ID
                }, payload || {}), '*');
            } catch (e) { /* ignore */ }
        }

        function renderStats() {
            dollarStat.textContent = '$' + (Number(dollars) || 0);
            ticketStat.textContent = String(tickets.length);
            ticketList.innerHTML = tickets.map(function(t) {
                return '<div class="ticket-chip"><span>' + escapeHtml(t.title) + '</span><span class="t">' +
                    escapeHtml(t.tier || 'ticket') + '</span></div>';
            }).join('');
        }

        function escapeHtml(s) {
            return String(s || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function setStageHtml(html) {
            stage.innerHTML = html;
        }

        function showIdle() {
            setStageHtml('<div class="idle-hint" id="idleHint">Select a student.<br>Then execute the penalty.</div>');
        }

        function resizeCanvas() {
            var rect = canvas.getBoundingClientRect();
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.floor(rect.width * dpr);
            canvas.height = Math.floor(rect.height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function spawnParticles(count, inward) {
            var w = canvas.clientWidth || 300;
            var h = canvas.clientHeight || 300;
            var cx = w / 2;
            var cy = h / 2;
            for (var i = 0; i < count; i++) {
                var angle = Math.random() * Math.PI * 2;
                var radius = inward ? (40 + Math.random() * 110) : (Math.random() * 20);
                particles.push({
                    x: cx + Math.cos(angle) * radius,
                    y: cy + Math.sin(angle) * radius,
                    vx: Math.cos(angle) * (inward ? -1.8 : 2.2) * (0.5 + Math.random()),
                    vy: Math.sin(angle) * (inward ? -1.8 : 2.2) * (0.5 + Math.random()),
                    life: 1,
                    decay: 0.012 + Math.random() * 0.02,
                    color: Math.random() > 0.5 ? '#ff1e38' : (Math.random() > 0.5 ? '#7b1fa2' : '#00ffc8'),
                    size: 1.5 + Math.random() * 2.5
                });
            }
            if (!particleAnim) particleAnim = requestAnimationFrame(drawParticles);
        }

        function drawParticles() {
            var w = canvas.clientWidth || 300;
            var h = canvas.clientHeight || 300;
            var cx = w / 2;
            var cy = h / 2;
            ctx.clearRect(0, 0, w, h);

            // dark abyss core
            var g = ctx.createRadialGradient(cx, cy, 4, cx, cy, Math.min(w, h) * 0.42);
            g.addColorStop(0, 'rgba(0,0,0,0.95)');
            g.addColorStop(0.45, 'rgba(58,0,92,0.25)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(cx, cy, Math.min(w, h) * 0.42, 0, Math.PI * 2);
            ctx.fill();

            particles = particles.filter(function(p) { return p.life > 0; });
            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];
                if (collapseMode) {
                    p.vx += (cx - p.x) * 0.01;
                    p.vy += (cy - p.y) * 0.01;
                }
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            if (particles.length || collapseMode) {
                particleAnim = requestAnimationFrame(drawParticles);
            } else {
                particleAnim = null;
                ctx.clearRect(0, 0, w, h);
            }
        }

        function loadStudents() {
            if (Array.isArray(STUDENTS) && STUDENTS.length) {
                fillStudentSelect(STUDENTS);
                return Promise.resolve();
            }
            if (!CLASS_ID || !NODE_API) {
                fillStudentSelect([]);
                return Promise.resolve();
            }
            return toolFetch(NODE_API + '/api/students?classId=' + encodeURIComponent(CLASS_ID))
                .then(function(res) { return res.json().then(function(data) {
                    if (!res.ok) throw new Error(data.error || 'Could not load students');
                    var list = Array.isArray(data) ? data : (data.students || []);
                    fillStudentSelect(list);
                }); })
                .catch(function(err) {
                    fillStudentSelect([]);
                    setStatus(err.message || 'Failed to load students', 'error');
                });
        }

        function fillStudentSelect(list) {
            STUDENTS = (list || []).map(function(s) {
                return {
                    id: String(s.id || s.studentId || ''),
                    name: String(s.name || s.studentName || ''),
                    onLeave: !!(s.onLeave || s.on_leave)
                };
            }).filter(function(s) {
                return s.id && s.name && !s.onLeave;
            });
            studentSelect.innerHTML = '<option value="">— Select student —</option>' +
                STUDENTS.map(function(s) {
                    return '<option value="' + escapeHtml(s.id) + '">' + escapeHtml(s.name) + '</option>';
                }).join('');
            executeBtn.disabled = true;
        }

        function loadInventory(studentId) {
            dollars = 0;
            tickets = [];
            renderStats();
            if (!studentId) {
                executeBtn.disabled = true;
                showIdle();
                return Promise.resolve();
            }
            setStatus('Scanning inventory…');
            executeBtn.disabled = true;
            return Promise.all([
                toolFetch(NODE_API + '/api/dollar/balance?studentId=' + encodeURIComponent(studentId))
                    .then(function(res) { return res.json().then(function(data) {
                        if (!res.ok) throw new Error(data.error || 'Balance failed');
                        return Number(data.balance) || 0;
                    }); }),
                toolFetch(NODE_API + '/api/lucky-draw/student?classId=' + encodeURIComponent(CLASS_ID) +
                    '&studentId=' + encodeURIComponent(studentId))
                    .then(function(res) { return res.json().then(function(data) {
                        if (!res.ok) throw new Error(data.error || 'Tickets failed');
                        var grouped = data.tickets || [];
                        var flat = [];
                        // Prefer raw ticket list if available via grouped ticketIds
                        grouped.forEach(function(g) {
                            var ids = g.ticketIds || [];
                            if (ids.length) {
                                ids.forEach(function(id) {
                                    flat.push({
                                        id: String(id),
                                        title: String(g.prizeText || 'Ticket'),
                                        tier: String(g.tier || ''),
                                        icon: 'ticket'
                                    });
                                });
                            } else {
                                var count = Number(g.count) || 1;
                                for (var i = 0; i < count; i++) {
                                    flat.push({
                                        id: 'tmp_' + String(g.prizeText) + '_' + i,
                                        title: String(g.prizeText || 'Ticket'),
                                        tier: String(g.tier || ''),
                                        icon: 'ticket'
                                    });
                                }
                            }
                        });
                        return flat;
                    }); })
            ]).then(function(pair) {
                dollars = pair[0];
                tickets = pair[1];
                renderStats();
                executeBtn.disabled = false;
                setStatus(tickets.length
                    ? 'Tickets detected. Ready to sacrifice.'
                    : 'No tickets — shadows will steal dollars.', 'ok');
                showIdle();
            }).catch(function(err) {
                setStatus(err.message || 'Inventory load failed', 'error');
                executeBtn.disabled = true;
            });
        }

        function buildTicketReel(items, finalId) {
            var sequence = [];
            var loops = Math.max(22, items.length * 7);
            for (var i = 0; i < loops; i++) {
                sequence.push(items[i % items.length]);
            }
            var finalItem = items.find(function(t) { return String(t.id) === String(finalId); }) || items[0];
            sequence.push(finalItem);
            var html = '<div class="reel-window"><div class="reel-pointer"></div><div class="reel-strip" id="reelStrip">' +
                sequence.map(function(t, idx) {
                    var isFinal = idx === sequence.length - 1;
                    return '<div class="reel-item' + (isFinal ? ' is-final' : '') + '"' +
                        (isFinal ? ' data-final="1"' : '') + '>' +
                        '<div class="tier">' + escapeHtml(t.tier || 'ticket') +
                        '</div><div class="title-text">' + escapeHtml(t.title) + '</div></div>';
                }).join('') + '</div></div>';
            setStageHtml(html);
            return { count: sequence.length, finalIndex: sequence.length - 1 };
        }

        function buildDollarReel(finalAmount) {
            var amounts = [-2, -3, -4, -5];
            var sequence = [];
            for (var i = 0; i < 28; i++) sequence.push(amounts[i % amounts.length]);
            sequence.push(-Math.abs(finalAmount));
            var html = '<div class="reel-window"><div class="reel-pointer"></div><div class="reel-strip" id="reelStrip">' +
                sequence.map(function(n, idx) {
                    var isFinal = idx === sequence.length - 1;
                    return '<div class="reel-item dollar-item' + (isFinal ? ' is-final' : '') + '"' +
                        (isFinal ? ' data-final="1"' : '') + '>' +
                        '<div class="tier">shadow tax</div>' +
                        '<div class="title-text">' + n + '</div></div>';
                }).join('') + '</div></div>';
            setStageHtml(html);
            return { count: sequence.length, finalIndex: sequence.length - 1 };
        }

        function getReelMetrics() {
            var win = stage.querySelector('.reel-window');
            var strip = document.getElementById('reelStrip');
            var item = strip && strip.querySelector('.reel-item');
            var winH = win ? win.clientHeight : 220;
            var itemH = item ? item.getBoundingClientRect().height : ITEM_H;
            if (!itemH || itemH < 40) itemH = ITEM_H;
            return {
                winH: winH,
                itemH: itemH,
                centerOffset: (winH - itemH) / 2
            };
        }

        function yForIndex(index, metrics) {
            // Align item center with the middle pointer band.
            return -(index * metrics.itemH) + metrics.centerOffset;
        }

        function spinToEnd(finalIndex) {
            return new Promise(function(resolve) {
                var strip = document.getElementById('reelStrip');
                if (!strip) return resolve();
                // Force layout so clientHeight is correct after setStageHtml.
                void strip.offsetHeight;
                var metrics = getReelMetrics();
                var startY = yForIndex(0, metrics);
                var finalY = yForIndex(finalIndex, metrics);
                strip.style.transform = 'translate3d(0, ' + startY + 'px, 0)';

                var start = performance.now();
                var duration = 3200;
                var lastTick = -1;
                function easeOutQuint(t) {
                    return 1 - Math.pow(1 - t, 5);
                }
                function frame(now) {
                    var p = Math.min((now - start) / duration, 1);
                    var eased = easeOutQuint(p);
                    var y = startY + (finalY - startY) * eased;
                    strip.style.transform = 'translate3d(0, ' + y + 'px, 0)';
                    var approxIdx = Math.round((-y + metrics.centerOffset) / metrics.itemH);
                    if (approxIdx !== lastTick) {
                        lastTick = approxIdx;
                        sfxTick();
                    }
                    if (p < 1) {
                        requestAnimationFrame(frame);
                    } else {
                        // Hard snap + tiny settle bounce so the stop is obvious.
                        strip.style.transform = 'translate3d(0, ' + finalY + 'px, 0)';
                        var bounceStart = performance.now();
                        function bounce(now2) {
                            var bp = Math.min((now2 - bounceStart) / 220, 1);
                            var over = Math.sin(bp * Math.PI) * 6 * (1 - bp);
                            strip.style.transform = 'translate3d(0, ' + (finalY + over) + 'px, 0)';
                            if (bp < 1) requestAnimationFrame(bounce);
                            else {
                                strip.style.transform = 'translate3d(0, ' + finalY + 'px, 0)';
                                resolve();
                            }
                        }
                        requestAnimationFrame(bounce);
                    }
                }
                requestAnimationFrame(frame);
            });
        }

        function sleep(ms) {
            return new Promise(function(r) { setTimeout(r, ms); });
        }

        function highlightLandedReel() {
            var win = stage.querySelector('.reel-window');
            var strip = document.getElementById('reelStrip');
            if (win) win.classList.add('is-landed');
            if (!strip) return;
            var finalItem = strip.querySelector('.reel-item.is-final') ||
                strip.querySelectorAll('.reel-item')[strip.querySelectorAll('.reel-item').length - 1];
            if (finalItem) finalItem.classList.add('is-chosen');
            // Keep final item locked in the pointer center after highlight.
            var metrics = getReelMetrics();
            var items = strip.querySelectorAll('.reel-item');
            var finalIndex = items.length - 1;
            strip.style.transform = 'translate3d(0, ' + yForIndex(finalIndex, metrics) + 'px, 0)';
        }

        function runShatterShards(cardEl) {
            return new Promise(function(resolve) {
                if (!cardEl) return resolve();
                var portal = document.getElementById('portalWrap');
                var layer = document.createElement('div');
                layer.className = 'shatter-layer';
                portal.appendChild(layer);

                var rect = cardEl.getBoundingClientRect();
                var portalRect = portal.getBoundingClientRect();
                var left = rect.left - portalRect.left;
                var top = rect.top - portalRect.top;
                var cols = 4;
                var rows = 3;
                var pieceW = rect.width / cols;
                var pieceH = rect.height / rows;
                var cx = left + rect.width / 2;
                var cy = top + rect.height / 2;
                var shards = [];

                for (var r = 0; r < rows; r++) {
                    for (var c = 0; c < cols; c++) {
                        var shard = document.createElement('div');
                        shard.className = 'shard';
                        var x = left + c * pieceW;
                        var y = top + r * pieceH;
                        var w = pieceW + (Math.random() * 4 - 1);
                        var h = pieceH + (Math.random() * 4 - 1);
                        shard.style.width = w + 'px';
                        shard.style.height = h + 'px';
                        shard.style.left = x + 'px';
                        shard.style.top = y + 'px';
                        shard.style.borderRadius = (2 + Math.random() * 6) + 'px';
                        shard.style.clipPath = 'polygon(' +
                            (5 + Math.random() * 15) + '% 0%,' +
                            '100% ' + (Math.random() * 20) + '%,' +
                            (80 + Math.random() * 20) + '% 100%,' +
                            '0% ' + (70 + Math.random() * 30) + '%)';
                        layer.appendChild(shard);
                        var angle = Math.atan2((y + h / 2) - cy, (x + w / 2) - cx);
                        var burst = 38 + Math.random() * 70;
                        shards.push({
                            el: shard,
                            x: x,
                            y: y,
                            rot: (Math.random() * 40 - 20),
                            vx: Math.cos(angle) * burst * 0.035,
                            vy: Math.sin(angle) * burst * 0.035 - 0.8,
                            spin: (Math.random() * 18 - 9)
                        });
                    }
                }

                cardEl.classList.add('is-vanish');
                var start = performance.now();
                var burstMs = 280;
                var suckMs = 900;

                function frame(now) {
                    var t = now - start;
                    for (var i = 0; i < shards.length; i++) {
                        var s = shards[i];
                        if (t < burstMs) {
                            var p = t / burstMs;
                            var bx = s.x + s.vx * t;
                            var by = s.y + s.vy * t + 0.01 * t * t;
                            s.el.style.transform = 'translate(' + (bx - s.x) + 'px,' + (by - s.y) +
                                'px) rotate(' + (s.rot + s.spin * p) + 'deg) scale(' + (1 - p * 0.08) + ')';
                            s.el.style.opacity = String(1 - p * 0.15);
                        } else {
                            var p2 = Math.min((t - burstMs) / suckMs, 1);
                            var eased = p2 * p2;
                            var bx0 = s.x + s.vx * burstMs;
                            var by0 = s.y + s.vy * burstMs + 0.01 * burstMs * burstMs;
                            var tx = cx - pieceW / 2;
                            var ty = cy - pieceH / 2;
                            var x2 = bx0 + (tx - bx0) * eased;
                            var y2 = by0 + (ty - by0) * eased;
                            var sc = Math.max(0.02, 1 - eased);
                            s.el.style.transform = 'translate(' + (x2 - s.x) + 'px,' + (y2 - s.y) +
                                'px) rotate(' + (s.rot + s.spin * (1 + p2 * 4)) + 'deg) scale(' + sc + ')';
                            s.el.style.opacity = String(1 - eased);
                        }
                    }
                    if (t < burstMs + suckMs) {
                        requestAnimationFrame(frame);
                    } else {
                        if (layer.parentNode) layer.parentNode.removeChild(layer);
                        resolve();
                    }
                }
                requestAnimationFrame(frame);
            });
        }

        function destroyTicketVisual(ticket) {
            return new Promise(function(resolve) {
                // Keep reel visible until we promote the landed ticket into a held card.
                setStageHtml(
                    '<div class="ticket-card is-held" id="doomCard">' +
                    '<div class="tier">' + escapeHtml(ticket.tier || 'ticket') + '</div>' +
                    '<div class="prize">' + escapeHtml(ticket.title || 'Lucky Ticket') + '</div>' +
                    '</div>'
                );
                setStatus('Ticket locked…');
                // Hold the revealed ticket so the player can read it.
                sleep(2500).then(function() {
                    var card = document.getElementById('doomCard');
                    if (card) {
                        card.classList.remove('is-held');
                        card.classList.add('is-flashing');
                    }
                    setStatus('DESTROYING…');
                    collapseMode = true;
                    spawnParticles(40, true);
                    document.body.classList.add('is-shaking');
                    sfxShatter();
                    return sleep(480);
                }).then(function() {
                    var card = document.getElementById('doomCard');
                    if (card) card.classList.remove('is-flashing');
                    spawnParticles(70, true);
                    return runShatterShards(card);
                }).then(function() {
                    setStageHtml('<div class="result-banner consume">CONSUMED BY DARKNESS…</div>');
                    document.body.classList.remove('is-shaking');
                    return sleep(900);
                }).then(function() {
                    collapseMode = false;
                    resolve();
                });
            });
        }

        function shieldProtectVisual(shield, protectedCount) {
            return new Promise(function(resolve) {
                var n = Math.max(0, Number(protectedCount) || 0);
                var minis = '';
                for (var i = 0; i < Math.min(n, 5); i++) {
                    minis += '<div class="shield-mini" id="safeCard' + i + '"></div>';
                }
                setStageHtml(
                    '<div class="shield-scene" id="shieldScene">' +
                    '<div class="shield-stack">' + minis + '</div>' +
                    '<div class="shield-dome" id="shieldDome"></div>' +
                    '<div class="void-bolt" id="voidBolt"></div>' +
                    '<div class="ticket-card shield-hero" id="shieldCard">' +
                    '<div class="tier">' + escapeHtml(shield.tier || 'SHIELD') + '</div>' +
                    '<div class="prize">' + escapeHtml(shield.title || 'Unlucky Draw Shield') + '</div>' +
                    '</div></div>'
                );
                setStatus('SHIELD DETECTED…');
                sfxShield();
                sleep(700).then(function() {
                    var dome = document.getElementById('shieldDome');
                    var card = document.getElementById('shieldCard');
                    if (dome) dome.classList.add('show');
                    if (card) card.classList.add('is-guarding');
                    for (var j = 0; j < Math.min(n, 5); j++) {
                        var el = document.getElementById('safeCard' + j);
                        if (el) el.classList.add('is-safe');
                    }
                    setStatus('PROTECTING ALL TICKETS!');
                    return sleep(900);
                }).then(function() {
                    // Void bolts slam the dome and bounce away
                    var bolt = document.getElementById('voidBolt');
                    var dome = document.getElementById('shieldDome');
                    var hits = 0;
                    function hitOnce() {
                        return new Promise(function(done) {
                            if (!bolt || !dome) { done(); return; }
                            bolt.style.opacity = '1';
                            bolt.style.left = '8%';
                            bolt.style.top = '12%';
                            bolt.style.transition = 'none';
                            requestAnimationFrame(function() {
                                bolt.style.transition = 'left 0.38s ease-in, top 0.38s ease-in, opacity 0.38s';
                                bolt.style.left = '46%';
                                bolt.style.top = '44%';
                                sleep(360).then(function() {
                                    dome.classList.remove('is-hit');
                                    void dome.offsetWidth;
                                    dome.classList.add('is-hit');
                                    sfxTick();
                                    bolt.style.transition = 'left 0.45s ease-out, top 0.45s ease-out, opacity 0.45s';
                                    bolt.style.left = (70 + Math.random() * 20) + '%';
                                    bolt.style.top = (5 + Math.random() * 20) + '%';
                                    bolt.style.opacity = '0';
                                    sleep(420).then(done);
                                });
                            });
                        });
                    }
                    function chain() {
                        if (hits >= 3) return Promise.resolve();
                        hits += 1;
                        return hitOnce().then(chain);
                    }
                    return chain();
                }).then(function() {
                    setStatus('Shield burns out…');
                    var card = document.getElementById('shieldCard');
                    if (card) {
                        card.classList.remove('is-guarding');
                        card.classList.add('is-flashing');
                    }
                    sfxShieldBreak();
                    spawnParticles(35, false);
                    return sleep(700);
                }).then(function() {
                    var card = document.getElementById('shieldCard');
                    if (card) card.classList.remove('is-flashing');
                    return runShatterShards(card);
                }).then(function() {
                    var msg = n > 0
                        ? ('SHIELD SACRIFICED — ' + n + ' TICKET' + (n === 1 ? '' : 'S') + ' SAFE!')
                        : 'SHIELD SACRIFICED!';
                    setStageHtml('<div class="result-banner shield">' + msg + '</div>');
                    return sleep(1200);
                }).then(function() {
                    resolve();
                });
            });
        }

        function stealDollarsVisual(amount, newBalance) {
            return new Promise(function(resolve) {
                dollarStat.classList.add('draining');
                collapseMode = true;
                spawnParticles(45, true);
                document.body.classList.add('is-shaking');
                sfxShatter();
                var start = dollars;
                var frames = 18;
                var i = 0;
                function step() {
                    i++;
                    var t = i / frames;
                    dollarStat.textContent = '$' + Math.round(start + (newBalance - start) * t);
                    if (i < frames) requestAnimationFrame(step);
                    else {
                        dollars = newBalance;
                        dollarStat.classList.remove('draining');
                        renderStats();
                        setStageHtml('<div class="result-banner">-$' + amount +
                            ' DOLLARS STOLEN BY THE SHADOWS!</div>');
                        document.body.classList.remove('is-shaking');
                        sleep(1000).then(function() {
                            collapseMode = false;
                            resolve();
                        });
                    }
                }
                requestAnimationFrame(step);
            });
        }

        async function executePenalty() {
            if (state !== 'idle' && state !== 'finished') return;
            var studentId = studentSelect.value;
            if (!CLASS_ID || !studentId) {
                setStatus('Select a student first.', 'error');
                return;
            }
            ensureAudio();
            sfxBoom();
            state = 'loading';
            executeBtn.disabled = true;
            studentSelect.disabled = true;
            setStatus('The void is choosing…');

            var result;
            try {
                var res = await toolFetch(NODE_API + '/api/lucky-draw/unlucky', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ classId: CLASS_ID, studentId: studentId })
                });
                result = await res.json();
                if (!res.ok) throw new Error(result.error || 'Penalty failed');
            } catch (err) {
                state = 'idle';
                executeBtn.disabled = false;
                studentSelect.disabled = false;
                setStatus(err.message || 'Penalty failed', 'error');
                return;
            }

            if (result.mode === 'shield') {
                var shieldInfo = result.shield || {};
                var shieldId = String(shieldInfo.ticketId || '');
                state = 'spinning';
                setStatus('A shield rises from the void…');
                var shieldLocal = tickets.slice();
                if (shieldId && !shieldLocal.some(function(t) { return t.id === shieldId; })) {
                    shieldLocal.push({
                        id: shieldId,
                        title: shieldInfo.prizeText || 'Unlucky Draw Shield',
                        tier: shieldInfo.tier || '',
                        icon: 'ticket'
                    });
                }
                if (!shieldLocal.length) {
                    shieldLocal = [{
                        id: shieldId || 'shield',
                        title: shieldInfo.prizeText || 'Unlucky Draw Shield',
                        tier: shieldInfo.tier || '',
                        icon: 'ticket'
                    }];
                }
                var reelS = buildTicketReel(shieldLocal, shieldId || shieldLocal[0].id);
                await spinToEnd(reelS.finalIndex);
                state = 'landed';
                highlightLandedReel();
                setStatus('SHIELD LOCKED IN');
                await sleep(1400);
                state = 'destroying';
                await shieldProtectVisual({
                    id: shieldId || shieldLocal[0].id,
                    title: shieldInfo.prizeText || 'Unlucky Draw Shield',
                    tier: shieldInfo.tier || 'SHIELD'
                }, result.protectedCount);
                if (shieldId) {
                    tickets = tickets.filter(function(t) { return t.id !== shieldId; });
                }
                if (result.remainingCount != null) {
                    while (tickets.length > result.remainingCount) tickets.pop();
                }
                renderStats();
                notifyParent({
                    studentId: studentId,
                    ticketCount: result.remainingCount,
                    newBalance: result.dollars
                });
                setStatus(result.message || 'Shield protected the tickets!', 'ok');
            } else if (result.mode === 'ticket' && result.ticket) {
                // Ensure ticket exists in local list for reel
                var local = tickets.slice();
                if (!local.some(function(t) { return t.id === result.ticket.ticketId; })) {
                    local.push({
                        id: result.ticket.ticketId,
                        title: result.ticket.prizeText || 'Ticket',
                        tier: result.ticket.tier || '',
                        icon: 'ticket'
                    });
                }
                if (!local.length) {
                    local = [{
                        id: result.ticket.ticketId,
                        title: result.ticket.prizeText || 'Ticket',
                        tier: result.ticket.tier || '',
                        icon: 'ticket'
                    }];
                }
                state = 'spinning';
                setStatus('Sacrificing a lucky ticket…');
                var reel = buildTicketReel(local, result.ticket.ticketId);
                await spinToEnd(reel.finalIndex);
                state = 'landed';
                highlightLandedReel();
                setStatus('LOCKED ON TARGET');
                await sleep(2200);
                state = 'destroying';
                await destroyTicketVisual({
                    id: result.ticket.ticketId,
                    title: result.ticket.prizeText || 'Ticket',
                    tier: result.ticket.tier || ''
                });
                tickets = tickets.filter(function(t) { return t.id !== result.ticket.ticketId; });
                // remainingCount is authoritative
                if (result.remainingCount != null) {
                    while (tickets.length > result.remainingCount) tickets.pop();
                }
                renderStats();
                notifyParent({
                    studentId: studentId,
                    ticketCount: result.remainingCount,
                    newBalance: result.dollars
                });
                setStatus('DESTROYED! Ticket consumed.', 'ok');
            } else if (result.mode === 'dollars') {
                state = 'spinning';
                setStageHtml('<div class="warn-banner">NO TICKETS FOUND TO SACRIFICE!</div>');
                await sleep(900);
                var amount = Number(result.amount) || 0;
                var reel2 = buildDollarReel(amount || result.rolled || 2);
                setStatus('Stealing dollars from the shadows…');
                await spinToEnd(reel2.finalIndex);
                state = 'landed';
                highlightLandedReel();
                await sleep(1200);
                state = 'destroying';
                if (amount <= 0) {
                    setStageHtml('<div class="result-banner">THE SHADOWS FOUND NOTHING…</div>');
                    await sleep(900);
                } else {
                    await stealDollarsVisual(amount, Number(result.newBalance) || 0);
                }
                dollars = Number(result.newBalance) || 0;
                renderStats();
                notifyParent({
                    studentId: studentId,
                    ticketCount: 0,
                    newBalance: result.newBalance
                });
                setStatus(amount > 0 ? ('Stolen $' + amount + '.') : 'Nothing left to take.', 'ok');
            } else {
                setStatus(
                    'Unexpected result' +
                    (result && result.mode ? (' (' + result.mode + ')') : '') +
                    '. Close and reopen Unlucky Draw, then try again.',
                    'error'
                );
            }

            state = 'finished';
            executeBtn.disabled = false;
            studentSelect.disabled = false;
            executeBtn.textContent = '[ EXECUTE AGAIN ]';
        }

        studentSelect.addEventListener('change', function() {
            if (state === 'spinning' || state === 'destroying' || state === 'loading') return;
            state = 'idle';
            executeBtn.textContent = '[ EXECUTE PENALTY ]';
            loadInventory(studentSelect.value);
        });
        executeBtn.addEventListener('click', function() {
            executePenalty();
        });
        window.addEventListener('resize', resizeCanvas);

        resizeCanvas();
        showIdle();
        loadStudents().then(function() {
            setStatus('Awaiting a victim…');
        });
    })();
    </script>
</body>
