<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocab Platform Admin — sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #12202e;
      --muted: #5a6d7c;
      --sea: #0f6b6b;
      --sea-deep: #0a4f4f;
      --wash: #e7f1f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 0% 0%, #b9ddd8 0%, transparent 55%),
        radial-gradient(700px 420px at 100% 10%, #c9d9ea 0%, transparent 50%),
        linear-gradient(180deg, #f4f8f8 0%, var(--wash) 100%);
    }
    .card {
      width: min(400px, 100%);
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(18,32,46,0.08);
      border-radius: 18px;
      padding: 1.75rem 1.5rem 1.4rem;
      backdrop-filter: blur(10px);
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.55rem;
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }
    p { margin: 0 0 1.2rem; color: var(--muted); font-size: 0.92rem; line-height: 1.4; }
    label { display: block; font-size: 0.78rem; font-weight: 700; margin-bottom: 0.35rem; }
    input {
      width: 100%;
      border: 1px solid rgba(18,32,46,0.16);
      border-radius: 10px;
      padding: 0.7rem 0.85rem;
      font: inherit;
      margin-bottom: 0.85rem;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 0.75rem;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(180deg, var(--sea), var(--sea-deep));
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    #err { color: #b42318; font-size: 0.85rem; min-height: 1.2em; margin-top: 0.65rem; }
  </style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>Vocab Platform</h1>
    <p>Central console for tenants, word bank, and curriculum packs.</p>
    <label for="password">Admin password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="btn">Sign in</button>
    <div id="err"></div>
  </form>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var next = params.get('next') || '/vocab-admin';
      document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var btn = document.getElementById('btn');
        var err = document.getElementById('err');
        btn.disabled = true;
        err.textContent = '';
        try {
          var res = await fetch('/api/vocab/platform/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: document.getElementById('password').value })
          });
          var data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Login failed');
          try { localStorage.setItem('vocab_platform_token', data.token); } catch (x) {}
          location.replace(next);
        } catch (ex) {
          err.textContent = ex.message || String(ex);
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
