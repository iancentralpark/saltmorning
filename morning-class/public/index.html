<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Salt Academy Morning Class</title>
  <meta name="description" content="Salt Academy Morning Class — nurturing wisdom and character.">
  <link rel="stylesheet" href="/css/app.css?v=20260806login2">
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="/" aria-label="Salt Academy home">
      <svg class="site-brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="none" stroke="#C5A059" stroke-width="2"/>
        <path d="M32 48V22" stroke="#A3B18A" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M32 28c-8-2-14-8-16-14 8 1 14 5 16 10 2-5 8-9 16-10-2 6-8 12-16 14z" fill="#A3B18A"/>
        <path d="M32 36c-7 1-12 6-14 12 7-2 12-5 14-9 2 4 7 7 14 9-2-6-7-11-14-12z" fill="#3B4A34"/>
      </svg>
      <span>
        <span class="site-brand-name">Salt Academy</span>
        <span class="site-brand-tag">Morning Class</span>
      </span>
    </a>
    <button type="button" class="site-nav-cta" id="navSignInBtn">Sign in</button>
  </header>

  <main class="hero">
    <div class="hero-leaf-pattern" aria-hidden="true"></div>
    <div class="hero-inner">
      <svg class="hero-emblem" viewBox="0 0 96 96" role="img" aria-label="Olive tree emblem">
        <circle cx="48" cy="48" r="44" fill="#FBF9F5" stroke="#C5A059" stroke-width="2.5"/>
        <path d="M48 72V34" stroke="#3B4A34" stroke-width="3" stroke-linecap="round"/>
        <path d="M48 40c-12-3-21-12-24-21 12 2 21 8 24 15 3-7 12-13 24-15-3 9-12 18-24 21z" fill="#A3B18A"/>
        <path d="M48 52c-10 2-18 9-21 18 10-3 17-7 21-13 4 6 11 10 21 13-3-9-11-16-21-18z" fill="#3B4A34"/>
        <circle cx="48" cy="28" r="3" fill="#C5A059"/>
      </svg>

      <h1 class="hero-brand">Salt Academy</h1>
      <p class="hero-headline">Nurturing Wisdom &amp; Character</p>
      <p class="hero-support">A calm morning portal for students, families, and teachers — rooted in growth, like the olive tree.</p>

      <form id="unifiedLogin" class="card login-card form-grid" autocomplete="on">
        <h2>Sign in</h2>
        <p class="muted small" style="margin:0">One login for students, parents, teachers, and admin.</p>
        <input id="loginId" name="username" placeholder="Login ID" autocomplete="username" required>
        <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <div class="login-options">
          <label class="login-check">
            <input type="checkbox" id="staySignedIn" checked>
            <span>Stay signed in</span>
          </label>
          <label class="login-check">
            <input type="checkbox" id="savePassword">
            <span>Save password</span>
          </label>
        </div>
        <div class="error" id="loginError"></div>
        <button class="btn btn-primary btn-block" type="submit">Enter Morning Class</button>
      </form>
    </div>
  </main>

<script src="/js/app.js?v=20260806login2"></script>
<script>
(function() {
  const {
    api, setToken, setProfile, getToken, $,
    authPersistEnabled, setAuthPersist, getSavedLogin, setSavedLogin
  } = SaltApp;
  const DEST = { student: '/student', parent: '/parent', teacher: '/teacher', admin: '/admin' };

  ['admin', 'teacher', 'parent', 'student'].forEach((role) => {
    if (getToken(role)) {
      location.replace(DEST[role]);
    }
  });

  const loginForm = $('unifiedLogin');
  const navBtn = $('navSignInBtn');
  const stayEl = $('staySignedIn');
  const saveEl = $('savePassword');

  if (navBtn && loginForm) {
    navBtn.addEventListener('click', function () {
      loginForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
      var id = $('loginId');
      if (id) id.focus();
    });
  }

  // Restore saved credentials / persist preference
  const saved = getSavedLogin();
  if (saved && saved.savePassword) {
    $('loginId').value = saved.loginId || '';
    $('password').value = saved.password || '';
    saveEl.checked = true;
  }
  stayEl.checked = authPersistEnabled();

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    $('loginError').textContent = '';
    const loginId = $('loginId').value.trim();
    const password = $('password').value;
    const stay = stayEl.checked;
    const savePw = saveEl.checked;

    setAuthPersist(stay);
    setSavedLogin({
      savePassword: savePw,
      loginId: loginId,
      password: password,
      staySignedIn: stay
    });

    try {
      const data = await api('/api/auth/login', {
        method: 'POST',
        body: { loginId: loginId, password: password }
      });
      const role = data.role;
      if (!role || !DEST[role]) throw new Error('Unknown account type.');
      ['admin', 'teacher', 'parent', 'student'].forEach((r) => {
        setToken(r, '');
        setProfile(r, null);
      });
      setToken(role, data.token);
      setProfile(role, data.profile);
      location.href = DEST[role];
    } catch (err) {
      $('loginError').textContent = err.message || 'Login failed.';
    }
  });
})();
</script>
</body>
</html>
