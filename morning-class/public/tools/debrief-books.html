<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oral Debrief Books — Salt Morning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a1f2e; --muted: #5c6578; --line: #d8deea; --paper: #f4f6fb;
      --accent: #1e4d8c; --accent-soft: #e8f0fa; --coral: #c45d55; --ok: #2f6b4f;
      --shadow: 0 10px 28px rgba(26, 31, 46, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Noto Sans KR', system-ui, sans-serif; color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(30,77,140,.10), transparent 40%),
        linear-gradient(165deg, #eef2f8 0%, var(--paper) 55%, #e9edf5 100%);
      min-height: 100vh;
    }
    .hidden { display: none !important; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap;
      padding: .7rem 1.1rem; background: rgba(255,255,255,.92); border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 20; backdrop-filter: blur(8px);
    }
    .brand { font-family: Fraunces, Georgia, serif; font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    .brand small { display: block; font-family: 'Noto Sans KR', sans-serif; font-size: .68rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
    .pane { padding: 1rem 1.1rem 2rem; }
    .layout { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 1rem; align-items: start; }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
    .side, .main {
      background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: var(--shadow); padding: 1rem;
    }
    h2 { font-family: Fraunces, Georgia, serif; margin: 0 0 .65rem; font-size: 1.2rem; color: var(--accent); }
    label { display: flex; flex-direction: column; gap: .25rem; font-size: .75rem; font-weight: 700; color: var(--muted); margin-bottom: .55rem; }
    input, select, textarea {
      border: 1px solid var(--line); border-radius: 9px; padding: .45rem .55rem; font: inherit; color: var(--ink); background: #fff;
    }
    textarea { min-height: 9rem; resize: vertical; }
    .hint { font-size: .8rem; color: var(--muted); line-height: 1.4; margin: 0 0 .65rem; }
    .btn {
      border: none; border-radius: 10px; padding: .48rem .85rem; font-weight: 700; cursor: pointer; font: inherit;
      display: inline-flex; align-items: center; gap: .35rem;
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #24599e, var(--accent)); color: #fff; }
    .btn-ghost { background: #fff; border: 1px solid var(--line); color: var(--accent); }
    .btn-ok { background: #e7f3ea; color: var(--ok); border: 1px solid #c9e3d0; }
    .btn-sm { padding: .3rem .65rem; font-size: .82rem; border-radius: 8px; }
    .actions { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .5rem; }
    .status { font-size: .85rem; margin-top: .65rem; color: var(--muted); min-height: 1.2em; }
    .status.error { color: var(--coral); font-weight: 600; }
    .status.ok { color: var(--ok); font-weight: 600; }
    .progress { height: 8px; background: #e8eef8; border-radius: 999px; overflow: hidden; margin-top: .45rem; }
    .progress > div { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #5a8fd4); transition: width .35s; }
    .book-list { display: grid; gap: .55rem; }
    .book-card {
      border: 1px solid var(--line); border-radius: 12px; padding: .7rem .8rem; background: #fff; cursor: pointer;
    }
    .book-card.active { border-color: var(--accent); background: var(--accent-soft); }
    .book-card strong { display: block; font-size: .95rem; }
    .meta { font-size: .75rem; color: var(--muted); margin-top: .2rem; }
    .pill {
      display: inline-block; font-size: .68rem; font-weight: 800; padding: .12rem .45rem; border-radius: 999px;
      background: #eef2f8; color: var(--muted); margin-right: .25rem;
    }
    .pill.ok { background: #e7f3ea; color: var(--ok); }
    .pill.warn { background: #fff3e6; color: #a65d1a; }
    .pill.err { background: #fdeceb; color: var(--coral); }
    .profile-view {
      font-size: .86rem; line-height: 1.45; max-height: 70vh; overflow: auto;
      background: #f8fafc; border: 1px solid var(--line); border-radius: 12px; padding: .85rem;
    }
    .profile-view h3 { margin: .9rem 0 .35rem; font-size: .95rem; color: var(--accent); }
    .profile-view h3:first-child { margin-top: 0; }
    .profile-view ul { margin: .2rem 0 .5rem 1.1rem; padding: 0; }
    .empty { text-align: center; color: var(--muted); padding: 2rem 1rem; }
    .spinner {
      display: inline-block; width: .9em; height: .9em; border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .assign-box {
      margin: 0 0 1rem; padding: .9rem; border: 2px solid #8eb0d8; border-radius: 12px; background: #eef5ff;
    }
    .assign-box h3 { margin: 0 0 .45rem; font-size: .95rem; color: var(--accent); font-family: Fraunces, Georgia, serif; }
    .assign-row { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    @media (max-width: 720px) { .assign-row { grid-template-columns: 1fr; } }
    .assign-list { display: grid; gap: .4rem; margin-top: .55rem; }
    .student-pick {
      max-height: 11rem; overflow: auto; border: 1px solid var(--line); border-radius: 10px;
      padding: .45rem .55rem; background: #fff; margin-top: .25rem;
    }
    .student-pick label {
      display: flex; flex-direction: row; align-items: center; gap: .45rem;
      font-size: .82rem; font-weight: 500; color: var(--ink); margin: .2rem 0;
    }
    .assign-item {
      display: flex; justify-content: space-between; gap: .5rem; align-items: flex-start;
      background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: .55rem .7rem; font-size: .84rem;
    }
    .assign-item .meta { margin-top: .15rem; }
    .results-box { margin-top: .75rem; padding: .8rem; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .results-box h4 { margin: 0 0 .5rem; font-size: .9rem; color: var(--accent); }
    .res-row { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .35rem 0; border-bottom: 1px solid #eef1f7; font-size: .84rem; }
    .res-row:last-child { border-bottom: 0; }
    .transcript { margin-top: .6rem; padding: .7rem; background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; max-height: 50vh; overflow: auto; font-size: .84rem; line-height: 1.45; }
    .turn { margin: .35rem 0; }
    .turn b { color: var(--accent); }
    .turn.student b { color: var(--ok); }
    .grade-panel { margin-top: .6rem; padding: .8rem; border: 1px solid #c9d6ec; border-radius: 12px; background: #f4f8fe; }
    .grade-panel h5 { margin: 0 0 .5rem; font-size: .9rem; color: var(--accent); display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    .grade-dim { display: grid; grid-template-columns: 8.5rem 4.2rem 1fr; gap: .45rem; align-items: start; margin-bottom: .5rem; font-size: .82rem; }
    @media (max-width: 720px) { .grade-dim { grid-template-columns: 1fr 4.2rem; } .grade-dim .gd-why { grid-column: 1 / -1; } }
    .grade-dim label { margin: 0; }
    .grade-dim textarea, .grade-panel textarea { min-height: 3.2rem; font-size: .82rem; width: 100%; }
    .grade-panel .quotes { font-size: .75rem; color: var(--muted); font-style: italic; margin-top: .15rem; }
    .grade-panel .total { font-size: 1.05rem; font-weight: 800; color: var(--accent); }
    .grade-panel label.block { display: block; margin: .5rem 0 .2rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Oral Debrief Books<small>Class Tools · Book Profile</small></div>
    <button type="button" class="btn btn-ghost btn-sm" id="btnRefresh">목록 새로고침</button>
  </header>
  <div class="pane">
    <div class="layout">
      <aside class="side">
        <h2>새 프로필 만들기</h2>
        <p class="hint">원서 텍스트 또는 PDF를 넣으면 AI가 인터뷰·채점용 <strong>Book Debrief Profile</strong>을 만듭니다. 원문 전체는 저장하지 않고 짧은 발췌만 남깁니다.</p>
        <label>제목 <input type="text" id="titleInput" placeholder="예: Charlotte's Web"></label>
        <label>저자 <input type="text" id="authorInput" placeholder="예: E. B. White"></label>
        <label>학년대
          <select id="gradeSelect">
            <option value="elementary">초등 고학년</option>
            <option value="middle" selected>중등</option>
            <option value="high">고등</option>
          </select>
        </label>
        <label>본문 붙여넣기
          <textarea id="textInput" placeholder="책 텍스트를 붙여넣으세요 (최소 약 200자). PDF를 쓸 경우 비워도 됩니다."></textarea>
        </label>
        <label>또는 PDF 업로드
          <input type="file" id="pdfInput" accept=".pdf,application/pdf">
        </label>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="btnGenerate">프로필 만들기</button>
        </div>
        <div class="progress hidden" id="progress"><div id="progressBar"></div></div>
        <div class="status" id="status"></div>

        <h2 style="margin-top:1.25rem">저장된 책</h2>
        <div class="book-list" id="bookList"><p class="hint">불러오는 중…</p></div>
      </aside>

      <section class="main">
        <div class="actions" style="justify-content:space-between;margin-top:0;margin-bottom:.75rem">
          <h2 style="margin:0" id="detailTitle">프로필 미리보기</h2>
          <div class="actions" style="margin:0">
            <button type="button" class="btn btn-ok btn-sm" id="btnVerify" disabled>Verified 표시</button>
            <button type="button" class="btn btn-ghost btn-sm" id="btnUnverify" disabled>검수 취소</button>
            <button type="button" class="btn btn-ghost btn-sm" id="btnDelete" disabled>삭제</button>
          </div>
        </div>
        <div id="emptyDetail" class="empty">왼쪽에서 책을 만들거나 목록에서 선택하세요.</div>
        <div id="assignBox" class="assign-box hidden">
          <h3>반에 과제 부여</h3>
          <p class="hint" id="assignHint">Verified 책만 반에 Oral Debrief 과제로 줄 수 있습니다.</p>
          <div id="assignForm">
            <div class="assign-row">
              <label>반 선택
                <select id="assignClassSelect"><option value="">불러오는 중…</option></select>
              </label>
              <label>마감일 (선택)
                <input type="date" id="assignDueDate">
              </label>
            </div>
            <label>과제 제목
              <input type="text" id="assignTitle" placeholder="Oral Debrief: …" maxlength="160">
            </label>
            <label>학생 안내 (선택)
              <textarea id="assignInstructions" style="min-height:4rem" placeholder="예: Ch.1–5까지 읽고 오라 / 한국어 섞어도 됨"></textarea>
            </label>
            <label>배정 학생 (비우면 반 전체)
              <div id="assignStudentPick" class="student-pick"><span class="hint">반을 선택하면 명단이 표시됩니다.</span></div>
            </label>
            <div class="actions">
              <button type="button" class="btn btn-primary btn-sm" id="btnAssign">선택한 학생에게 부여</button>
            </div>
          </div>
          <div class="assign-list" id="assignList"></div>
          <div class="results-box hidden" id="resultsBox"></div>
        </div>
        <div id="detailMount" class="profile-view hidden"></div>
      </section>
    </div>
  </div>

  <script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var books = [];
  var current = null;
  var pollTimer = null;
  var classOptions = [];
  var rosterByClass = {};
  var currentAssignments = [];

  function token() {
    try {
      return localStorage.getItem('salt_teacher_token') ||
        sessionStorage.getItem('salt_teacher_token') ||
        localStorage.getItem('salt_admin_token') ||
        sessionStorage.getItem('salt_admin_token') || '';
    } catch (e) { return ''; }
  }

  function isAdminSession() {
    try {
      return !!(localStorage.getItem('salt_admin_token') || sessionStorage.getItem('salt_admin_token'));
    } catch (e) { return false; }
  }

  function setStatus(msg, kind) {
    var el = $('status');
    el.textContent = msg || '';
    el.classList.remove('error', 'ok');
    if (kind === 'error') el.classList.add('error');
    if (kind === 'ok') el.classList.add('ok');
  }

  function api(url, opts) {
    opts = opts || {};
    opts.credentials = 'same-origin';
    var headers = opts.headers || {};
    var t = token();
    if (t) headers.Authorization = 'Bearer ' + t;
    if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
      headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    opts.headers = headers;
    return fetch(url, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (!r.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
        return data;
      });
    });
  }

  function escapeHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function statusPill(book) {
    if (book.status === 'generating') return '<span class="pill warn">생성 중 ' + (book.progress || 0) + '%</span>';
    if (book.status === 'error') return '<span class="pill err">실패</span>';
    if (book.isVerified) return '<span class="pill ok">Verified</span>';
    return '<span class="pill warn">초안</span>';
  }

  function renderList() {
    var mount = $('bookList');
    if (!books.length) {
      mount.innerHTML = '<p class="hint">아직 저장된 책이 없습니다.</p>';
      return;
    }
    mount.innerHTML = books.map(function (b) {
      var on = current && current.id === b.id ? ' active' : '';
      return '<div class="book-card' + on + '" data-id="' + escapeHtml(b.id) + '">' +
        '<strong>' + escapeHtml(b.title) + '</strong>' +
        '<div class="meta">' + statusPill(b) + escapeHtml(b.author || '—') +
        ' · ' + escapeHtml(b.gradeBand || '') + '</div></div>';
    }).join('');
    mount.querySelectorAll('.book-card').forEach(function (el) {
      el.addEventListener('click', function () { selectBook(el.getAttribute('data-id')); });
    });
  }

  function qList(arr, key) {
    key = key || 'q';
    if (!arr || !arr.length) return '<p class="hint">없음</p>';
    return '<ul>' + arr.map(function (item) {
      if (typeof item === 'string') return '<li>' + escapeHtml(item) + '</li>';
      return '<li>' + escapeHtml(item[key] || item.question || JSON.stringify(item)) + '</li>';
    }).join('') + '</ul>';
  }

  function classLabel(classId) {
    var hit = classOptions.find(function (c) { return String(c.classId) === String(classId); });
    return hit ? (hit.className || hit.name || classId) : classId;
  }

  function renderAssignPanel(book) {
    var box = $('assignBox');
    if (!book || !book.id || book.status !== 'ready') {
      box.classList.add('hidden');
      return;
    }
    box.classList.remove('hidden');
    $('resultsBox').classList.add('hidden');
    var verified = !!book.isVerified;
    $('assignForm').classList.toggle('hidden', !verified);
    $('assignHint').textContent = verified
      ? 'Verified 프로필을 반에 Oral Debrief 과제로 부여합니다. 학생 포털에 바로 표시됩니다.'
      : '먼저 Verified로 표시한 뒤에 반에 부여할 수 있습니다.';
    if (verified && !$('assignTitle').value) {
      $('assignTitle').value = 'Oral Debrief: ' + (book.title || '');
    }
    loadAssignments(book.id);
  }

  function renderAssignments() {
    var mount = $('assignList');
    if (!currentAssignments.length) {
      mount.innerHTML = '<p class="hint">아직 이 책이 부여된 반이 없습니다.</p>';
      return;
    }
    mount.innerHTML = currentAssignments.map(function (a) {
      var targetLabel = a.targeted
        ? ((a.studentIds || []).length + '명 지정')
        : '반 전체';
      return '<div class="assign-item" data-id="' + escapeHtml(a.id) + '">' +
        '<div><strong>' + escapeHtml(classLabel(a.classId)) + '</strong>' +
        '<div class="meta">' + escapeHtml(a.title || '') +
        ' · ' + escapeHtml(targetLabel) +
        (a.dueDate ? ' · Due ' + escapeHtml(a.dueDate) : '') + '</div></div>' +
        '<div class="actions" style="margin:0">' +
        '<button type="button" class="btn btn-ghost btn-sm assign-results" data-id="' + escapeHtml(a.id) + '">결과 보기</button>' +
        '<button type="button" class="btn btn-ghost btn-sm assign-del" data-id="' + escapeHtml(a.id) + '">해제</button></div></div>';
    }).join('');
    mount.querySelectorAll('.assign-results').forEach(function (btn) {
      btn.addEventListener('click', function () { showResults(btn.getAttribute('data-id')); });
    });
    mount.querySelectorAll('.assign-del').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-id');
        if (!confirm('이 반의 디브리프 과제를 해제할까요?')) return;
        api('/api/debrief/assignments/' + encodeURIComponent(id), { method: 'DELETE' }).then(function () {
          setStatus('과제 해제됨', 'ok');
          loadAssignments(current && current.id);
        }).catch(function (e) { setStatus(e.message, 'error'); });
      });
    });
  }

  function fmtTime(ms) {
    if (!ms) return '';
    try { return new Date(ms).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return ''; }
  }

  function sessionPill(s) {
    if (!s) return '<span class="pill">미시작</span>';
    if (s.status === 'completed') return '<span class="pill ok">완료</span>';
    return '<span class="pill warn">진행 중</span>';
  }

  function gradePill(s) {
    if (s.status !== 'completed') return '';
    if (s.gradeStatus === 'released') return '<span class="pill ok">공개 ' + (s.total != null ? s.total + '점' : '') + '</span>';
    if (s.gradeStatus === 'draft') return '<span class="pill warn">검수 대기 ' + (s.total != null ? s.total + '점' : '') + '</span>';
    return '<span class="pill">채점 전</span>';
  }

  var DIM_LABELS = { comprehension: '내용 이해', evidence: '근거 제시', criticalThinking: '비판적 사고', oralFluency: '구술 유창성' };
  var DIM_KEYS = ['comprehension', 'evidence', 'criticalThinking', 'oralFluency'];

  function lines(v) { return String(v || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean); }

  function renderGradePanel(assignmentId, s) {
    var g = s.grade;
    var released = s.gradeStatus === 'released';
    var html = '<div class="grade-panel" id="gradePanel">';
    if (!g) {
      html += '<h5>성적</h5><p class="hint">' + (s.status !== 'completed' ? '세션이 끝나면 채점할 수 있습니다.' :
        (s.gradeError ? '자동 채점 실패: ' + escapeHtml(s.gradeError) : '아직 채점되지 않았습니다.')) + '</p>';
      if (s.status === 'completed') html += '<div class="actions"><button type="button" class="btn btn-primary btn-sm" id="btnGrade">AI 채점</button></div>';
      html += '</div>';
      return html;
    }
    html += '<h5>성적 ' + (released ? '<span class="pill ok">학생에게 공개됨</span>' : '<span class="pill warn">초안 · 학생에게 안 보임</span>') +
      '<span class="total" id="gradeTotal">' + (g.total != null ? g.total + '점' : '—') + '</span>' +
      (g.aiGenerated && !g.edited ? '<span class="meta">AI 초안</span>' : (g.edited ? '<span class="meta">교사 수정됨</span>' : '')) + '</h5>';
    DIM_KEYS.forEach(function (k) {
      var d = g.dimensions[k] || {};
      html += '<div class="grade-dim"><div><strong>' + DIM_LABELS[k] + '</strong></div>' +
        '<select data-dim="' + k + '" class="gd-score"><option value="">—</option>' +
        [1, 2, 3, 4].map(function (n) { return '<option value="' + n + '"' + (d.score === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select>' +
        '<div class="gd-why"><textarea data-dim="' + k + '" class="gd-rationale">' + escapeHtml(d.rationale || '') + '</textarea>' +
        ((d.quotes || []).length ? '<div class="quotes">“' + (d.quotes || []).map(escapeHtml).join('” · “') + '”</div>' : '') + '</div></div>';
    });
    html += '<label class="block">잘한 점 (한 줄에 하나)</label><textarea id="gStrengths">' + escapeHtml((g.strengths || []).join('\n')) + '</textarea>';
    html += '<label class="block">보완할 점 (한 줄에 하나)</label><textarea id="gImprove">' + escapeHtml((g.improvements || []).join('\n')) + '</textarea>';
    html += '<label class="block">학생에게 보이는 피드백</label><textarea id="gFeedback" style="min-height:5rem">' + escapeHtml(g.studentFeedback || '') + '</textarea>';
    html += '<label class="block">교사 메모 (학생에게 안 보임)</label><textarea id="gNotes">' + escapeHtml(g.teacherNotes || '') + '</textarea>';
    html += '<div class="actions">' +
      '<button type="button" class="btn btn-primary btn-sm" id="btnSaveGrade">저장</button>' +
      (released
        ? '<button type="button" class="btn btn-ghost btn-sm" id="btnUnrelease">공개 취소</button>'
        : '<button type="button" class="btn btn-ok btn-sm" id="btnRelease">학생에게 공개</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" id="btnGrade">AI 재채점</button>') +
      '</div>';
    if (released) html += '<p class="hint">공개된 성적을 저장하면 학생 화면에 바로 반영됩니다. AI 재채점은 공개를 취소한 뒤에 가능합니다.</p>';
    html += '</div>';
    return html;
  }

  function collectGradePatch() {
    var dims = {};
    document.querySelectorAll('#gradePanel .gd-score').forEach(function (el) {
      var k = el.getAttribute('data-dim'); dims[k] = dims[k] || {};
      dims[k].score = el.value === '' ? null : Number(el.value);
    });
    document.querySelectorAll('#gradePanel .gd-rationale').forEach(function (el) {
      var k = el.getAttribute('data-dim'); dims[k] = dims[k] || {};
      dims[k].rationale = el.value;
    });
    return {
      dimensions: dims,
      strengths: lines($('gStrengths').value),
      improvements: lines($('gImprove').value),
      studentFeedback: $('gFeedback').value,
      teacherNotes: $('gNotes').value
    };
  }

  function wireGradePanel(assignmentId, sessionId) {
    var base = '/api/debrief/assignments/' + encodeURIComponent(assignmentId) + '/sessions/' + encodeURIComponent(sessionId) + '/grade';
    function done(msg) { setStatus(msg, 'ok'); showResults(assignmentId, sessionId); }
    function fail(e) { setStatus(e.message || '실패', 'error'); }
    var bg = $('btnGrade');
    if (bg) bg.addEventListener('click', function () {
      bg.disabled = true; bg.innerHTML = '<span class="spinner"></span> 채점 중';
      api(base, { method: 'POST' }).then(function () { done('AI 채점 완료 — 검수 후 공개하세요.'); }).catch(function (e) { fail(e); bg.disabled = false; bg.textContent = 'AI 채점'; });
    });
    var bs = $('btnSaveGrade');
    if (bs) bs.addEventListener('click', function () {
      api(base, { method: 'PATCH', body: collectGradePatch() }).then(function () { done('저장됨'); }).catch(fail);
    });
    var br = $('btnRelease');
    if (br) br.addEventListener('click', function () {
      if (!confirm('이 학생에게 성적과 피드백을 공개할까요?')) return;
      api(base, { method: 'PATCH', body: collectGradePatch() })
        .then(function () { return api(base + '/release', { method: 'POST', body: { released: true } }); })
        .then(function () { done('학생에게 공개됨'); }).catch(fail);
    });
    var bu = $('btnUnrelease');
    if (bu) bu.addEventListener('click', function () {
      api(base + '/release', { method: 'POST', body: { released: false } }).then(function () { done('공개 취소됨'); }).catch(fail);
    });
  }

  function showResults(assignmentId, openSessionId) {
    var box = $('resultsBox');
    box.classList.remove('hidden');
    box.innerHTML = '<p class="hint">불러오는 중…</p>';
    api('/api/debrief/assignments/' + encodeURIComponent(assignmentId) + '/sessions').then(function (data) {
      var sessions = data.sessions || [];
      var byStudent = {};
      sessions.forEach(function (s) { byStudent[s.studentId] = s; });
      var rows = [];
      (data.roster || []).forEach(function (st) {
        rows.push({ studentId: st.studentId, name: st.name, session: byStudent[st.studentId] });
        delete byStudent[st.studentId];
      });
      Object.keys(byStudent).forEach(function (sid) {
        var s = byStudent[sid];
        rows.push({ studentId: sid, name: s.studentName || sid, session: s });
      });
      var done = sessions.filter(function (s) { return s.status === 'completed'; }).length;
      var html = '<h4>' + escapeHtml((data.assignment && data.assignment.title) || '') + ' — ' +
        done + '/' + (rows.length || sessions.length) + ' 완료</h4>';
      if (!rows.length) html += '<p class="hint">아직 시작한 학생이 없습니다.</p>';
      html += rows.map(function (r) {
        var s = r.session;
        return '<div class="res-row"><div><strong>' + escapeHtml(r.name) + '</strong> ' + sessionPill(s) +
          (s ? gradePill(s) : '') +
          (s ? '<span class="meta"> 답변 ' + (s.studentTurns || 0) + '개 · ' + fmtTime(s.updatedAt) + '</span>' : '') + '</div>' +
          (s ? '<div class="actions" style="margin:0">' +
            '<button type="button" class="btn btn-ghost btn-sm res-view" data-sid="' + escapeHtml(s.id) + '">대화 보기</button>' +
            '<button type="button" class="btn btn-ghost btn-sm res-reset" data-sid="' + escapeHtml(s.id) + '">초기화</button></div>' : '') +
          '</div>';
      }).join('');
      html += '<div id="transcriptMount"></div>';
      box.innerHTML = html;
      box.querySelectorAll('.res-view').forEach(function (b) {
        b.addEventListener('click', function () { showTranscript(assignmentId, b.getAttribute('data-sid')); });
      });
      if (openSessionId) showTranscript(assignmentId, openSessionId);
      box.querySelectorAll('.res-reset').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('이 학생의 세션을 삭제하고 처음부터 다시 하게 할까요?')) return;
          api('/api/debrief/assignments/' + encodeURIComponent(assignmentId) + '/sessions/' + encodeURIComponent(b.getAttribute('data-sid')), { method: 'DELETE' })
            .then(function () { setStatus('세션 초기화됨', 'ok'); showResults(assignmentId); })
            .catch(function (e) { setStatus(e.message, 'error'); });
        });
      });
    }).catch(function (e) {
      box.innerHTML = '<p class="hint">' + escapeHtml(e.message || '결과를 불러오지 못했습니다.') + '</p>';
    });
  }

  function showTranscript(assignmentId, sessionId) {
    var mount = $('transcriptMount');
    mount.innerHTML = '<p class="hint">불러오는 중…</p>';
    api('/api/debrief/assignments/' + encodeURIComponent(assignmentId) + '/sessions/' + encodeURIComponent(sessionId)).then(function (s) {
      mount.innerHTML = renderGradePanel(assignmentId, s) + '<div class="transcript"><strong>' + escapeHtml(s.studentName || '') + '</strong>' +
        (s.turns || []).map(function (t) {
          var ai = t.role === 'ai';
          return '<div class="turn ' + (ai ? 'ai' : 'student') + '"><b>' + (ai ? 'AI' : '학생') +
            (t.source === 'voice' ? ' 🎤' : '') + ':</b> ' + escapeHtml(t.text) + '</div>';
        }).join('') + '</div>';
      wireGradePanel(assignmentId, sessionId);
    }).catch(function (e) {
      mount.innerHTML = '<p class="hint">' + escapeHtml(e.message) + '</p>';
    });
  }

  function loadAssignments(bookId) {
    if (!bookId) return Promise.resolve();
    return api('/api/debrief/books/' + encodeURIComponent(bookId) + '/assignments').then(function (data) {
      currentAssignments = data.assignments || [];
      renderAssignments();
    }).catch(function () {
      currentAssignments = [];
      renderAssignments();
    });
  }


  function selectedStudentIds() {
    var box = $('assignStudentPick');
    if (!box) return null;
    var ids = Array.prototype.map.call(box.querySelectorAll('input[type=checkbox]:checked'), function (el) {
      return el.value;
    }).filter(Boolean);
    return ids.length ? ids : null;
  }

  function renderStudentPick(students) {
    var box = $('assignStudentPick');
    if (!box) return;
    students = students || [];
    if (!students.length) {
      box.innerHTML = '<span class="hint">이 반에 학생이 없습니다.</span>';
      return;
    }
    box.innerHTML = students.map(function (st) {
      var id = st.studentId || st.id;
      return '<label><input type="checkbox" value="' + escapeHtml(id) + '"> ' +
        escapeHtml(st.name || id) + ' <span class="meta">(' + escapeHtml(id) + ')</span></label>';
    }).join('');
  }

  function loadRosterForAssign(classId) {
    classId = String(classId || '').trim();
    if (!classId) {
      renderStudentPick([]);
      $('assignStudentPick').innerHTML = '<span class="hint">반을 선택하면 명단이 표시됩니다.</span>';
      return Promise.resolve();
    }
    if (rosterByClass[classId]) {
      renderStudentPick(rosterByClass[classId]);
      return Promise.resolve(rosterByClass[classId]);
    }
    $('assignStudentPick').innerHTML = '<span class="hint">명단 불러오는 중…</span>';
    var url = isAdminSession()
      ? '/api/admin/classes/' + encodeURIComponent(classId)
      : '/api/teacher/class/' + encodeURIComponent(classId) + '/roster';
    return api(url).then(function (data) {
      var students = data.students || (data.class && data.class.students) || [];
      rosterByClass[classId] = students;
      renderStudentPick(students);
      return students;
    }).catch(function () {
      $('assignStudentPick').innerHTML = '<span class="hint">명단을 불러오지 못했습니다.</span>';
    });
  }

  function loadClassOptions() {
    var sel = $('assignClassSelect');
    var req = isAdminSession()
      ? api('/api/admin/classes')
      : api('/api/teacher/classes');
    return req.then(function (data) {
      var seen = {};
      var opts = [];
      function push(c) {
        if (!c) return;
        var id = c.classId || c.id;
        var name = c.className || c.name || id;
        if (!id || seen[id]) return;
        seen[id] = true;
        opts.push({ classId: id, className: name });
      }
      (data.classes || []).forEach(push);
      (data.homeroom || []).forEach(push);
      (data.assigned || []).forEach(push);
      classOptions = opts;
      if (!opts.length) {
        sel.innerHTML = '<option value="">배정된 반이 없습니다</option>';
        return;
      }
      sel.innerHTML = '<option value="">반 선택…</option>' + opts.map(function (c) {
        return '<option value="' + escapeHtml(c.classId) + '">' + escapeHtml(c.className) + '</option>';
      }).join('');
      var want = new URLSearchParams(location.search).get('class');
      if (want && seen[want]) {
        sel.value = want;
        loadRosterForAssign(want);
      }
    }).catch(function () {
      sel.innerHTML = '<option value="">반 목록을 불러오지 못했습니다</option>';
    });
  }

  function renderDetail(book) {
    current = book;
    $('detailTitle').textContent = book.title || '프로필 미리보기';
    var ready = book.status === 'ready' && book.debriefProfile;
    $('btnVerify').disabled = !ready || !!book.isVerified;
    $('btnUnverify').disabled = !ready || !book.isVerified;
    $('btnDelete').disabled = !book.id || book.status === 'generating';
    if (!book.debriefProfile) {
      $('emptyDetail').classList.remove('hidden');
      $('emptyDetail').textContent = book.message || (book.status === 'generating' ? '생성 중…' : '프로필이 없습니다.');
      $('detailMount').classList.add('hidden');
      $('assignBox').classList.add('hidden');
      renderList();
      return;
    }
    $('emptyDetail').classList.add('hidden');
    $('detailMount').classList.remove('hidden');
    var p = book.debriefProfile;
    var html = '';
    html += '<div>' + statusPill(book) + ' <span class="meta">' + escapeHtml(book.message || '') + '</span></div>';
    if (p.oneSentenceHook) html += '<p><em>' + escapeHtml(p.oneSentenceHook) + '</em></p>';
    html += '<h3>Summary</h3><p>' + escapeHtml(p.summary || '') + '</p>';
    html += '<h3>Themes</h3><p>' + escapeHtml((p.themes || []).join(' · ')) + '</p>';
    html += '<h3>Characters</h3><ul>' + (p.characters || []).map(function (c) {
      return '<li><strong>' + escapeHtml(c.name) + '</strong> (' + escapeHtml(c.role || '') + ') — ' +
        escapeHtml((c.traits || []).join(', ')) +
        (c.arc ? '<br><span class="meta">' + escapeHtml(c.arc) + '</span>' : '') + '</li>';
    }).join('') + '</ul>';
    html += '<h3>Plot beats</h3><ul>' + (p.plotBeats || []).map(function (b) {
      return '<li><strong>' + escapeHtml(b.label) + '</strong> — ' + escapeHtml(b.summary || '') + '</li>';
    }).join('') + '</ul>';
    html += '<h3>Comprehension</h3>' + qList(p.questionBank && p.questionBank.comprehension);
    html += '<h3>Evidence</h3>' + qList(p.questionBank && p.questionBank.evidence);
    html += '<h3>Critical thinking</h3>' + qList(p.questionBank && p.questionBank.criticalThinking);
    html += '<h3>Socratic follow-ups</h3>' + qList(p.questionBank && p.questionBank.socraticFollowups);
    html += '<h3>Proper nouns (STT hints)</h3><p>' + escapeHtml((p.properNouns || []).join(', ')) + '</p>';
    html += '<h3>Interview opening</h3><p>' + escapeHtml(p.interviewOpening || '') + '</p>';
    html += '<h3>Interview closing</h3><p>' + escapeHtml(p.interviewClosing || '') + '</p>';
    $('detailMount').innerHTML = html;
    renderAssignPanel(book);
    renderList();
  }

  function loadList() {
    return api('/api/debrief/books?profile=0').then(function (data) {
      books = data.books || [];
      renderList();
    });
  }

  function selectBook(id) {
    setStatus('불러오는 중…');
    api('/api/debrief/books/' + encodeURIComponent(id)).then(function (book) {
      var idx = books.findIndex(function (b) { return b.id === book.id; });
      if (idx >= 0) books[idx] = Object.assign({}, books[idx], book);
      else books.unshift(book);
      renderDetail(book);
      setStatus('');
      if (book.status === 'generating') startPoll(book.id);
    }).catch(function (e) {
      setStatus(e.message || '불러오기 실패', 'error');
    });
  }

  function startPoll(id) {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function () {
      api('/api/debrief/books/' + encodeURIComponent(id)).then(function (book) {
        var idx = books.findIndex(function (b) { return b.id === book.id; });
        if (idx >= 0) books[idx] = Object.assign({}, books[idx], book);
        if (current && current.id === book.id) renderDetail(book);
        else renderList();
        $('progress').classList.remove('hidden');
        $('progressBar').style.width = Math.max(8, Number(book.progress) || 10) + '%';
        setStatus(book.message || '진행 중…');
        if (book.status === 'ready' || book.status === 'error') {
          clearInterval(pollTimer); pollTimer = null;
          $('progress').classList.add('hidden');
          $('btnGenerate').disabled = false;
          $('btnGenerate').textContent = '프로필 만들기';
          setStatus(book.status === 'ready' ? '초안 완료 — 검수해 Verified로 표시하세요.' : (book.error || '실패'), book.status === 'ready' ? 'ok' : 'error');
          loadList().then(function () {
            if (book.status === 'ready') selectBook(book.id);
          });
        }
      }).catch(function () { /* keep polling */ });
    }, 1600);
  }

  function generate() {
    var title = String($('titleInput').value || '').trim();
    var author = String($('authorInput').value || '').trim();
    var gradeBand = $('gradeSelect').value || 'middle';
    var text = String($('textInput').value || '').trim();
    var file = $('pdfInput').files && $('pdfInput').files[0];
    if (!title) { setStatus('제목을 입력하세요.', 'error'); return; }
    if (!text && !file) { setStatus('본문 텍스트 또는 PDF가 필요합니다.', 'error'); return; }

    $('btnGenerate').disabled = true;
    $('btnGenerate').innerHTML = '<span class="spinner"></span> 생성 중';
    $('progress').classList.remove('hidden');
    $('progressBar').style.width = '8%';
    setStatus('Claude가 Book Debrief Profile을 만드는 중…');

    var req;
    if (file) {
      var fd = new FormData();
      fd.append('pdf', file);
      fd.append('title', title);
      fd.append('author', author);
      fd.append('gradeBand', gradeBand);
      req = fetch('/api/debrief/books/generate-pdf', {
        method: 'POST', credentials: 'same-origin',
        headers: { Authorization: 'Bearer ' + token() },
        body: fd
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (data) {
          if (!r.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
          return data;
        });
      });
    } else {
      req = api('/api/debrief/books/generate', {
        method: 'POST',
        body: { title: title, author: author, gradeBand: gradeBand, text: text }
      });
    }

    req.then(function (book) {
      books = [book].concat(books.filter(function (b) { return b.id !== book.id; }));
      renderDetail(book);
      startPoll(book.id);
    }).catch(function (e) {
      setStatus(e.message || '생성 실패', 'error');
      $('btnGenerate').disabled = false;
      $('btnGenerate').textContent = '프로필 만들기';
      $('progress').classList.add('hidden');
    });
  }

  $('btnGenerate').addEventListener('click', generate);
  $('btnRefresh').addEventListener('click', function () {
    loadList().then(function () { setStatus('목록 갱신', 'ok'); }).catch(function (e) {
      setStatus(e.message || '목록 실패', 'error');
    });
  });
  $('btnVerify').addEventListener('click', function () {
    if (!current) return;
    api('/api/debrief/books/' + encodeURIComponent(current.id) + '/verify', {
      method: 'POST', body: { verified: true }
    }).then(function (book) {
      renderDetail(book);
      loadList();
      setStatus('Verified 처리됨 — 위쪽 「반에 과제 부여」에서 반을 고르세요.', 'ok');
      try { $('assignBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
    }).catch(function (e) { setStatus(e.message, 'error'); });
  });
  $('btnUnverify').addEventListener('click', function () {
    if (!current) return;
    api('/api/debrief/books/' + encodeURIComponent(current.id) + '/verify', {
      method: 'POST', body: { verified: false }
    }).then(function (book) {
      renderDetail(book);
      loadList();
      setStatus('검수 취소됨', 'ok');
    }).catch(function (e) { setStatus(e.message, 'error'); });
  });
  $('btnDelete').addEventListener('click', function () {
    if (!current) return;
    if (!confirm('이 Book Profile을 삭제할까요?')) return;
    api('/api/debrief/books/' + encodeURIComponent(current.id), { method: 'DELETE' }).then(function () {
      current = null;
      $('detailMount').classList.add('hidden');
      $('assignBox').classList.add('hidden');
      $('emptyDetail').classList.remove('hidden');
      $('emptyDetail').textContent = '왼쪽에서 책을 만들거나 목록에서 선택하세요.';
      $('btnVerify').disabled = true;
      $('btnUnverify').disabled = true;
      $('btnDelete').disabled = true;
      return loadList();
    }).then(function () { setStatus('삭제됨', 'ok'); })
      .catch(function (e) { setStatus(e.message, 'error'); });
  });

  $('assignClassSelect').addEventListener('change', function () {
    loadRosterForAssign($('assignClassSelect').value);
  });

  $('btnAssign').addEventListener('click', function () {
    if (!current || !current.isVerified) {
      setStatus('Verified 책만 부여할 수 있습니다.', 'error');
      return;
    }
    var classId = String($('assignClassSelect').value || '').trim();
    if (!classId) { setStatus('반을 선택하세요.', 'error'); return; }
    var title = String($('assignTitle').value || '').trim();
    var customInstructions = String($('assignInstructions').value || '').trim();
    var dueDate = String($('assignDueDate').value || '').trim();
    $('btnAssign').disabled = true;
    var studentIds = selectedStudentIds();
    api('/api/debrief/books/' + encodeURIComponent(current.id) + '/assign', {
      method: 'POST',
      body: {
        classId: classId,
        title: title,
        customInstructions: customInstructions,
        dueDate: dueDate || null,
        studentIds: studentIds
      }
    }).then(function () {
      var who = studentIds ? (studentIds.length + '명') : '반 전체';
      setStatus(classLabel(classId) + ' · ' + who + '에게 부여됨 — 학생 포털에 표시됩니다.', 'ok');
      return loadAssignments(current.id);
    }).catch(function (e) {
      setStatus(e.message || '부여 실패', 'error');
    }).then(function () {
      $('btnAssign').disabled = false;
    });
  });

  api('/api/debrief/books/meta').then(function (meta) {
    if (!meta.aiConfigured) setStatus('Claude API 키가 없습니다. 서버에 ANTHROPIC_API_KEY를 설정하세요.', 'error');
  }).catch(function () {});

  loadClassOptions();
  loadList().catch(function (e) {
    setStatus(e.message || '목록을 불러오지 못했습니다. 로그인 상태를 확인하세요.', 'error');
    $('bookList').innerHTML = '<p class="hint">교사 계정으로 로그인한 뒤 다시 열어 주세요.</p>';
  });
})();
  </script>
</body>
</html>
