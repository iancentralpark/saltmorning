<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Student — Salt Morning Class</title>
  <meta name="theme-color" content="#0D2748">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Salt Morning">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260818">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon.png?v=20260818">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20260818">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=20260818">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=20260818">
  <link rel="shortcut icon" href="/favicon.ico?v=20260818">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/app.css?v=20260803buddyui">
  <link rel="stylesheet" href="/css/vocab-learn.css?v=20260803vocab2">
</head>
<body class="student-body">
<div class="shell student-shell">
  <div id="appView" class="hidden">
    <div class="topbar student-topbar">
      <div>
        <div class="brand" id="welcomeText">Student</div>
        <div class="muted small" id="classLabel"></div>
      </div>
      <button class="btn btn-ghost" id="logoutBtn" type="button">Log out</button>
    </div>

    <div class="stu-summary-grid" id="homeSummary"></div>

    <div class="card stu-card vocab-shell" id="vocabShell">
      <div class="card-title"><i class="fa-solid fa-rocket"></i> Vocab Booster</div>

      <div id="vocabNeedsPlacement">
        <div class="vocab-hero">
          <p class="vocab-kicker">Vocab Booster</p>
          <h2>Find your tier first</h2>
          <p>Take a short placement test once. Then today’s words appear here automatically.</p>
        </div>
        <div class="vocab-actions">
          <button type="button" class="vocab-btn" id="vocabStartTestBtn">Start Placement Test</button>
        </div>
      </div>

      <div id="vocabPlacedFlow" class="hidden">
        <div class="vocab-tier-hero" id="vocabTierHero" role="button" tabindex="0" aria-expanded="false" aria-controls="vocabTierLadder" aria-live="polite" title="See all tiers">
          <div class="vocab-tier-badge-mark" id="vocabTierBadgeMark" aria-hidden="true"></div>
          <div class="vocab-tier-hero-text">
            <span class="vocab-tier-hero-label">Your tier</span>
            <span class="vocab-tier-hero-name" id="vocabStatTier">—</span>
            <span class="vocab-tier-hero-grade" id="vocabStatStart"></span>
          </div>
        </div>
        <div id="vocabQuestBody"></div>
      </div>

      <div class="vocab-pane" id="vocabQuizPane">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem;flex-wrap:wrap;">
          <strong id="vocabQuizCount">Question 1 / 12</strong>
        </div>
        <div class="vocab-progress"><span id="vocabQuizProgress"></span></div>
        <div id="vocabQuizBody"></div>
      </div>

      <div class="vocab-pane" id="vocabResultPane">
        <div id="vocabResultBody"></div>
      </div>
    </div>

    <div class="card stu-card" id="sectionHomework">
      <h3>Homework</h3>
      <p class="muted small" id="homeworkStatus">Loading…</p>
      <div id="homeworkList"></div>
    </div>

    <div class="card stu-card" id="sectionDollars">
      <h3>My dollars</h3>
      <p class="muted small" id="dollarStatus">Loading…</p>
      <div id="dollarBox">
        <strong id="dollarBalance">—</strong>
        <div id="dollarTx"></div>
      </div>
    </div>

    <div class="card stu-card" id="sectionAccount">
      <h3>Account</h3>
      <p class="muted small" id="moreProfile"></p>
      <p class="muted small" id="moreUnread"></p>
    </div>
  </div>
</div>

<!-- English Buddy — bottom-right float -->
<div id="buddyFloat" class="buddy-float panel-collapsed hidden" aria-label="English Buddy">
  <button type="button" class="buddy-float-fab" id="buddyFloatToggle" title="English Buddy" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2a9 9 0 0 0-9 9c0 3.2 1.7 6 4.2 7.6L6 22l4.1-1.7c.6.1 1.2.2 1.9.2a9 9 0 0 0 0-18zm0 2a7 7 0 1 1 0 14c-.6 0-1.1-.1-1.6-.2l-.5-.1-.9.4.3-1-.3-.4A6.9 6.9 0 0 1 5 11a7 7 0 0 1 7-7z"/></svg>
  </button>
  <div class="buddy-float-panel" id="buddyFloatPanel" aria-hidden="true">
    <div class="buddy-resize-grip" id="buddyResizeGrip" role="separator" aria-label="Resize chat window" title="Drag to resize"></div>
    <div class="buddy-float-head">
      <strong class="buddy-float-title">English Buddy</strong>
      <span class="buddy-head-spacer"></span>
      <button type="button" class="buddy-icon-btn buddy-reset-btn" id="buddyResetBtn" aria-label="Clear chat history" title="Clear chat history">
        <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
      </button>
      <button type="button" class="buddy-icon-btn buddy-minimize-btn" id="buddyFloatClose" aria-label="Minimize" title="Minimize">−</button>
    </div>
    <p id="buddyStatus" class="muted small buddy-status-line"></p>
    <div id="buddyChat" class="buddy-chat"></div>
    <form id="buddyForm" class="buddy-compose">
      <div class="stu-buddy-actions">
        <button type="button" class="btn btn-ghost buddy-chip" data-prompt="Help me understand this word: ">Word</button>
        <button type="button" class="btn btn-ghost buddy-chip" data-prompt="Help me plan my essay about ">Essay</button>
        <button type="button" class="btn btn-ghost buddy-chip" data-prompt="How can I say this more naturally: ">Native</button>
      </div>
      <textarea id="buddyInput" placeholder="Ask English Buddy…" maxlength="800" rows="2"></textarea>
      <button class="btn btn-primary" type="submit">Send</button>
      <div class="error" id="buddyError"></div>
    </form>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
<script src="/js/messenger.js?v=20260803vocab2"></script>
<script src="/js/vocab-learn.js?v=20260803vocab2"></script>
<script>
(function() {
  const role = 'student';
  const { api, getToken, setToken, getProfile, setProfile, $, show, hide, escapeHtml } = SaltApp;
  let buddyHistory = [];
  let dashboard = null;
  let buddyOpen = false;

  if (!getToken(role)) {
    location.replace('/');
    return;
  }

  // Bridge for Mr.Park vocab-learn.js
  window.mrParkStudentApi = function(path, opts) {
    return api(path, opts || {}, role);
  };
  window.getLoggedInStudentId = function() {
    const p = getProfile(role) || {};
    return p.studentId || '';
  };
  window.MrParkLuckyEffects = {
    revealSpin: function() { return Promise.resolve(); },
    celebrateDollars: function() {
      loadDashboard();
      return Promise.resolve();
    }
  };

  function chip(label, value) {
    return '<div class="stu-chip"><span class="stu-chip-label">' + escapeHtml(label) +
      '</span><strong>' + escapeHtml(String(value)) + '</strong></div>';
  }

  function setBuddyOpen(on) {
    buddyOpen = !!on;
    const float = $('buddyFloat');
    float.classList.toggle('panel-collapsed', !buddyOpen);
    float.querySelector('.buddy-float-panel').setAttribute('aria-hidden', buddyOpen ? 'false' : 'true');
    $('buddyFloatToggle').setAttribute('aria-expanded', buddyOpen ? 'true' : 'false');
    if (buddyOpen) {
      applyBuddyPanelSize();
      loadBuddyHistory();
      loadBuddyStatus();
    }
  }

  const BUDDY_SIZE_KEY = 'salt_buddy_float_size';

  function buddySizeLimits() {
    return {
      minW: 280,
      minH: 360,
      maxW: Math.min(560, window.innerWidth - 24),
      maxH: Math.min(720, window.innerHeight - 24)
    };
  }

  function applyBuddyPanelSize() {
    const panel = $('buddyFloatPanel');
    if (!panel) return;
    try {
      const saved = JSON.parse(localStorage.getItem(BUDDY_SIZE_KEY) || 'null');
      if (!saved) return;
      const lim = buddySizeLimits();
      const w = Math.max(lim.minW, Math.min(lim.maxW, Number(saved.w) || 0));
      const h = Math.max(lim.minH, Math.min(lim.maxH, Number(saved.h) || 0));
      if (w) panel.style.width = w + 'px';
      if (h) panel.style.height = h + 'px';
    } catch (e) { /* ignore */ }
  }

  function persistBuddyPanelSize() {
    const panel = $('buddyFloatPanel');
    if (!panel || !buddyOpen) return;
    try {
      localStorage.setItem(BUDDY_SIZE_KEY, JSON.stringify({
        w: panel.offsetWidth,
        h: panel.offsetHeight
      }));
    } catch (e) { /* ignore */ }
  }

  function initBuddyResize() {
    const panel = $('buddyFloatPanel');
    const grip = $('buddyResizeGrip');
    if (!panel || !grip) return;
    let dragging = false;
    let startX = 0;
    let startY = 0;
    let startW = 0;
    let startH = 0;

    grip.addEventListener('pointerdown', (e) => {
      if (!buddyOpen) return;
      e.preventDefault();
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      startW = panel.offsetWidth;
      startH = panel.offsetHeight;
      grip.setPointerCapture(e.pointerId);
      document.body.classList.add('buddy-resize-active');
    });
    grip.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const lim = buddySizeLimits();
      // Grip is top-left: drag left/up grows the panel (anchored bottom-right)
      const w = Math.max(lim.minW, Math.min(lim.maxW, startW + (startX - e.clientX)));
      const h = Math.max(lim.minH, Math.min(lim.maxH, startH + (startY - e.clientY)));
      panel.style.width = w + 'px';
      panel.style.height = h + 'px';
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      document.body.classList.remove('buddy-resize-active');
      try { grip.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      persistBuddyPanelSize();
    }
    grip.addEventListener('pointerup', endDrag);
    grip.addEventListener('pointercancel', endDrag);
  }

  function renderBuddy() {
    const box = $('buddyChat');
    box.innerHTML = buddyHistory.map((h) =>
      '<div class="msg ' + (h.role === 'student' || h.role === 'user' ? 'user' : 'buddy') + '"><div class="msg-meta">' +
      escapeHtml(h.role === 'buddy' || h.role === 'assistant' ? 'English Buddy' : 'You') +
      '</div>' + escapeHtml(h.text) + '</div>'
    ).join('') || '<p class="muted">Say hello to English Buddy!</p>';
    box.scrollTop = box.scrollHeight;
  }

  function setBuddyStatusText(s) {
    if (!s) return;
    if (!s.configured) {
      $('buddyStatus').textContent = 'English Buddy is starting up…';
      return;
    }
    if (s.abuseLocked) {
      $('buddyStatus').textContent = 'Locked today — ask your teacher to unlock.';
      return;
    }
    $('buddyStatus').textContent = 'Remaining today: ' + s.remaining + ' / ' + s.dailyLimit;
  }

  async function loadBuddyStatus() {
    try {
      setBuddyStatusText(await api('/api/student/english-buddy/status', {}, role));
    } catch (e) { /* ignore */ }
  }

  async function loadBuddyHistory() {
    try {
      const data = await api('/api/student/english-buddy/history', {}, role);
      buddyHistory = (data.messages || []).map((m) => ({
        role: m.role === 'user' ? 'student' : 'buddy',
        text: m.text
      }));
      renderBuddy();
      if (data.status) setBuddyStatusText(data.status);
    } catch (e) {
      renderBuddy();
    }
  }

  function renderHome() {
    if (!dashboard) return;
    const s = dashboard.summary || {};
    const v = dashboard.vocab || {};
    $('homeSummary').innerHTML =
      chip('Messages', s.unreadMessages || 0) +
      chip('Homework', s.pendingHomework || 0) +
      chip('Dollars', s.dollars == null ? '—' : s.dollars) +
      chip('Vocab', v.placementDone ? (v.tierName || v.tier || 'Ready') : 'Place first');
  }

  function renderHomework() {
    const hw = (dashboard && dashboard.homework) || {};
    if (!hw.available) {
      $('homeworkStatus').textContent = 'No homework yet.';
      $('homeworkList').innerHTML = '';
      return;
    }
    const pending = hw.pending || [];
    const today = hw.today || [];
    const completed = hw.completed || [];
    $('homeworkStatus').textContent = pending.length
      ? (pending.length + ' pending — your teacher marks completion')
      : 'All caught up!';

    let html = '';
    if (today.length) {
      html += '<h4 class="stu-section-label">Today</h4><ul class="stu-list">' +
        today.map((x) => hwItem(x)).join('') + '</ul>';
    }
    if (pending.length) {
      html += '<h4 class="stu-section-label">Pending</h4><ul class="stu-list">' +
        pending.map((x) => hwItem(x)).join('') + '</ul>';
    }
    if (completed.length) {
      html += '<h4 class="stu-section-label">Recently done</h4><ul class="stu-list">' +
        completed.slice(0, 8).map((x) =>
          '<li><strong>' + escapeHtml(x.title || 'Homework') + '</strong>' +
          '<div class="muted small">Completed' +
          (x.completedAt ? ' · ' + escapeHtml(String(x.completedAt).slice(0, 16).replace('T', ' ')) : '') +
          '</div></li>'
        ).join('') + '</ul>';
    }
    $('homeworkList').innerHTML = html || '<p class="muted">No homework right now.</p>';
  }

  function hwItem(x) {
    return '<li><strong>' + escapeHtml(x.title || 'Homework') + '</strong>' +
      (x.assignedDate ? '<div class="muted small">' + escapeHtml(x.assignedDate) + '</div>' : '') +
      (x.description ? '<div class="muted small">' + escapeHtml(x.description) + '</div>' : '') +
      '</li>';
  }

  function renderDollars() {
    const d = (dashboard && dashboard.dollars) || {};
    const p = (dashboard && dashboard.profile) || getProfile(role) || {};
    if (!d.available) {
      $('dollarStatus').textContent = 'Balance will appear when ready.';
      $('dollarBalance').textContent = '—';
      $('dollarTx').innerHTML = '';
    } else {
      $('dollarStatus').textContent = 'Current balance';
      $('dollarBalance').textContent = '$' + (d.balance || 0);
      const txs = d.transactions || [];
      $('dollarTx').innerHTML = txs.length
        ? '<ul class="stu-list">' + txs.map((t) =>
          '<li><strong>' + (t.amount > 0 ? '+' : '') + escapeHtml(String(t.amount)) + '</strong>' +
          '<div class="muted small">' + escapeHtml(t.reason || '') +
          (t.at ? ' · ' + escapeHtml(String(t.at).slice(0, 16).replace('T', ' ')) : '') +
          '</div></li>'
        ).join('') + '</ul>'
        : '<p class="muted small">No transactions yet.</p>';
    }
    $('moreUnread').textContent = dashboard && dashboard.summary
      ? ('Unread messages: ' + (dashboard.summary.unreadMessages || 0) + ' — tap the chat icon (bottom left)')
      : '';
    $('moreProfile').textContent = (p.name || '') +
      (p.className ? ' · ' + p.className : '') +
      (p.studentId ? ' · ' + p.studentId : '');
  }

  async function loadDashboard() {
    try {
      dashboard = await api('/api/student/dashboard', {}, role);
      const p = dashboard.profile || {};
      $('welcomeText').textContent = 'Hi, ' + (p.name || 'Student');
      $('classLabel').textContent = p.className || '';
      renderHome();
      renderHomework();
      renderDollars();
      if (dashboard.buddy) setBuddyStatusText(dashboard.buddy);
      show($('buddyFloat'));
      if (window.MrParkVocabLearn) {
        window.MrParkVocabLearn.onLogin();
      }
    } catch (e) {
      $('homeworkStatus').textContent = e.message || 'Could not load dashboard.';
    }
  }

  document.querySelectorAll('.buddy-chip').forEach((btn) => {
    btn.addEventListener('click', () => {
      $('buddyInput').value = btn.dataset.prompt || '';
      $('buddyInput').focus();
    });
  });

  $('buddyFloatToggle').addEventListener('click', () => setBuddyOpen(!buddyOpen));
  $('buddyFloatClose').addEventListener('click', () => setBuddyOpen(false));

  $('buddyResetBtn').addEventListener('click', async () => {
    if (!buddyHistory.length) {
      alert('No chat history to clear.');
      return;
    }
    if (!confirm('Clear all English Buddy chat history?\n\nThis cannot be undone.')) return;
    const btn = $('buddyResetBtn');
    btn.disabled = true;
    try {
      await api('/api/student/english-buddy/history', { method: 'DELETE' }, role);
      buddyHistory = [];
      renderBuddy();
    } catch (e) {
      alert(e.message || 'Could not clear chat.');
    } finally {
      btn.disabled = false;
    }
  });

  initBuddyResize();

  // Enter sends; Shift+Enter inserts newline
  $('buddyInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      $('buddyForm').requestSubmit();
    }
  });

  $('buddyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('buddyError').textContent = '';
    const message = $('buddyInput').value.trim();
    if (!message) return;
    buddyHistory.push({ role: 'student', text: message });
    renderBuddy();
    $('buddyInput').value = '';
    try {
      const data = await api('/api/student/english-buddy', {
        method: 'POST',
        body: { message, history: buddyHistory.slice(0, -1) }
      }, role);
      buddyHistory.push({ role: 'buddy', text: data.reply });
      renderBuddy();
      if (data.status) setBuddyStatusText(data.status);
      loadDashboard();
    } catch (err) {
      $('buddyError').textContent = err.message;
    }
  });

  $('logoutBtn').addEventListener('click', () => {
    if (window.MrParkVocabLearn) window.MrParkVocabLearn.onLogout();
    setToken(role, '');
    setProfile(role, null);
    location.href = '/';
  });

  show($('appView'));
  if (window.MrParkVocabLearn) window.MrParkVocabLearn.init();
  SaltMessenger.init(role);
  loadDashboard();
})();
</script>
</body>
</html>
