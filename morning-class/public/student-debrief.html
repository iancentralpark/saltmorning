<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Oral Debrief — Salt Morning</title>
  <meta name="theme-color" content="#0D2748">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20260818">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root { --ink:#16233a; --muted:#5d6b82; --line:#d7e0ee; --navy:#0D2748; --teal:#12806f; --teal-soft:#e4f4f0; --coral:#c24a40; --paper:#f3f6fb; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin:0; font-family: system-ui, -apple-system, 'Noto Sans KR', sans-serif; color:var(--ink); background:var(--paper); display:flex; flex-direction:column; }
    .hidden { display:none !important; }
    header { background:var(--navy); color:#fff; padding:.7rem 1rem; display:flex; align-items:center; gap:.75rem; padding-top:calc(.7rem + env(safe-area-inset-top)); }
    header a { color:#cfe0f5; text-decoration:none; font-size:.9rem; }
    header .title { font-weight:700; font-size:1rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .progress { height:4px; background:#cfd9ea; }
    .progress > div { height:100%; width:0; background:var(--teal); transition:width .4s; }
    main { flex:1; overflow-y:auto; padding:1rem; max-width:760px; width:100%; margin:0 auto; }
    .msg { display:flex; margin:.55rem 0; }
    .msg .bubble { max-width:86%; padding:.65rem .85rem; border-radius:16px; line-height:1.45; font-size:1rem; white-space:pre-wrap; overflow-wrap:anywhere; }
    .msg.ai .bubble { background:#fff; border:1px solid var(--line); border-top-left-radius:4px; }
    .msg.student { justify-content:flex-end; }
    .msg.student .bubble { background:var(--teal); color:#fff; border-top-right-radius:4px; }
    .msg .who { font-size:.7rem; color:var(--muted); margin:0 .3rem .15rem; }
    .msg.student .who { text-align:right; }
    .thinking { color:var(--muted); font-size:.9rem; padding:.4rem .2rem; }
    .dock { background:#fff; border-top:1px solid var(--line); padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom)); }
    .dock-inner { max-width:760px; margin:0 auto; }
    .mic-row { display:flex; align-items:center; gap:.75rem; justify-content:center; }
    .mic { width:72px; height:72px; border-radius:50%; border:none; background:var(--teal); color:#fff; font-size:1.6rem; cursor:pointer; box-shadow:0 6px 16px rgba(18,128,111,.35); }
    .mic { position:relative; transition:background .2s, box-shadow .2s; }
    .mic::before { content:''; position:absolute; inset:-6px; border-radius:50%; border:3px solid transparent; transform:scale(calc(1 + var(--level, 0) * .25)); transition:transform .08s linear, border-color .2s; pointer-events:none; }
    .mic.listening { background:var(--teal); }
    .mic.listening::before { border-color:rgba(18,128,111,.35); }
    .mic.hearing { background:var(--coral); box-shadow:0 6px 16px rgba(194,74,64,.4); }
    .mic.hearing::before { border-color:rgba(194,74,64,.45); }
    .mic.thinking { background:#8794ab; box-shadow:none; }
    .mic.speaking { background:var(--navy); box-shadow:0 6px 16px rgba(13,39,72,.35); animation:pulse 1.4s infinite; }
    .mic.off { background:#fff; color:var(--teal); border:2px solid var(--teal); box-shadow:none; }
    .mic:disabled { opacity:.5; cursor:not-allowed; animation:none; }
    @keyframes pulse { 50% { transform:scale(1.07); } }
    .mic-label { font-size:.8rem; font-weight:700; color:var(--navy); text-align:center; margin-top:.7rem; min-height:1.1em; }
    .hint { text-align:center; color:var(--muted); font-size:.85rem; margin:.45rem 0 0; min-height:1.2em; }
    .hint.error { color:var(--coral); font-weight:600; }
    .btn { border:none; border-radius:12px; padding:.55rem .9rem; font:inherit; font-weight:700; cursor:pointer; }
    .bubble .caret { display:inline-block; width:.08em; height:1em; margin-left:.05em; background:currentColor; vertical-align:-.1em; animation:blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity:0; } }
    .btn-primary { background:var(--navy); color:#fff; }
    .btn-ghost { background:#fff; border:1px solid var(--line); color:var(--navy); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .tools { display:flex; justify-content:space-between; align-items:center; margin-top:.6rem; gap:.5rem; flex-wrap:wrap; }
    .tools label { font-size:.82rem; color:var(--muted); display:flex; align-items:center; gap:.35rem; }
    .done-card { background:var(--teal-soft); border:1px solid #bfe3da; border-radius:14px; padding:1rem; margin:1rem 0; text-align:center; }
    .report { background:#fff; border:1px solid var(--line); border-radius:16px; padding:1rem; margin:1rem 0; }
    .report h2 { margin:.1rem 0 .6rem; font-size:1.1rem; color:var(--navy); display:flex; justify-content:space-between; align-items:center; gap:.5rem; }
    .report .score { font-size:1.6rem; font-weight:800; color:var(--teal); }
    .dim { padding:.55rem 0; border-top:1px solid #eef1f7; }
    .dim .row { display:flex; justify-content:space-between; font-weight:700; }
    .dim .pips { color:var(--teal); letter-spacing:.1em; }
    .dim p { margin:.25rem 0 0; color:var(--muted); font-size:.92rem; line-height:1.45; }
    .report h3 { font-size:.95rem; margin:.9rem 0 .25rem; color:var(--navy); }
    .report ul { margin:.2rem 0 0 1.1rem; padding:0; line-height:1.5; }
    .feedback { background:var(--teal-soft); border-radius:12px; padding:.75rem .9rem; margin-top:.8rem; line-height:1.55; }
    .error-card { background:#fdeceb; border:1px solid #f3c5c1; color:var(--coral); border-radius:14px; padding:1rem; margin:1rem 0; }
    .buddy-stage {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:.55rem .75rem .15rem; background:linear-gradient(180deg,#eef4fb 0%, var(--paper) 100%);
      border-bottom:1px solid var(--line);
    }
    .buddy-frame {
      width:min(42vw, 168px); height:min(42vw, 168px); border-radius:22px;
      background:#fff; border:1px solid var(--line); box-shadow:0 8px 22px rgba(13,39,72,.08);
      overflow:hidden; position:relative;
    }
    .buddy-frame img, .buddy-frame video {
      width:100%; height:100%; object-fit:contain; display:block; background:#fff;
    }
    .buddy-frame video.hidden, .buddy-frame img.hidden { display:none !important; }
    .buddy-frame.is-speaking { animation:buddyBounce 0.55s ease-in-out infinite; }
    @keyframes buddyBounce {
      0%,100% { transform:translateY(0); }
      50% { transform:translateY(-4px); }
    }
    .buddy-caption {
      margin:.35rem 0 .2rem; font-size:.78rem; font-weight:700; color:var(--navy); min-height:1.1em;
    }
    @media (max-width:520px) {
      .buddy-frame { width:132px; height:132px; border-radius:18px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/student.html" id="backLink"><i class="fa-solid fa-chevron-left"></i> Back</a>
    <div class="title" id="titleText">Oral Debrief</div>
  </header>
  <div class="progress"><div id="progressBar"></div></div>

  <div class="buddy-stage" id="buddyStage" aria-hidden="false">
    <div class="buddy-frame" id="buddyFrame">
      <img id="buddyImg" src="/img/salt-buddy/idle-512.png" alt="Salt buddy">
      <video id="buddyVideo" class="hidden" muted loop playsinline preload="metadata"
        poster="/img/salt-buddy/talking.png">
        <source src="/img/salt-buddy/talking-loop.webm" type="video/webm">
        <source src="/img/salt-buddy/talking-loop.mp4" type="video/mp4">
      </video>
    </div>
    <div class="buddy-caption" id="buddyCaption">Ready when you are</div>
  </div>

  <main id="chat" aria-live="polite"></main>

  <div class="dock" id="dock">
    <div class="dock-inner">
      <div class="mic-row" id="micRow">
        <button type="button" class="mic off" id="micBtn" aria-label="Start talking"><i class="fa-solid fa-microphone"></i></button>
      </div>
      <div class="mic-label" id="micLabel"></div>
      <div class="hint" id="hint"></div>
      <div class="tools">
        <label><input type="checkbox" id="ttsToggle" checked> Read questions aloud (natural voice)</label>
        <button type="button" class="btn btn-ghost" id="endBtn">Finish early</button>
      </div>
    </div>
  </div>

<script src="/js/app.js?v=20260917session1"></script>
<script>
(function () {
  'use strict';
  var role = 'student';
  var api = SaltApp.api, getToken = SaltApp.getToken, esc = SaltApp.escapeHtml;
  var $ = function (id) { return document.getElementById(id); };

  if (!getToken(role)) { location.replace('/'); return; }

  var params = new URLSearchParams(location.search);
  var assignmentId = params.get('assignment') || '';
  var session = null;
  var busy = false;
  var sttConfigured = false;
  var ttsConfigured = false;
  var preferredVoice = null;
  /* Stagger student transcript vs teacher reply; type the AI bubble while it speaks. */
  var reveal = {
    hideLastAi: false,
    typing: false,
    full: '',
    shown: 0,
    timer: null,
    gen: 0,
    onDone: null
  };

  function setHint(msg, isError) {
    $('hint').textContent = msg || '';
    $('hint').classList.toggle('error', !!isError);
  }

  function sessionActive() { return !!session && session.status === 'active'; }

  function setBusy(v) {
    busy = v;
    if (v && buddyMood !== 'speaking') setBuddy('thinking', 'Thinking…');
    refreshMic();
  }

  /* Salt buddy avatar — emotion sprites + talking loop synced to TTS. */
  var BUDDY = {
    idle: '/img/salt-buddy/idle-512.png',
    listening: '/img/salt-buddy/listening.png',
    thinking: '/img/salt-buddy/thinking.png',
    happy: '/img/salt-buddy/happy.png',
    talking: '/img/salt-buddy/talking.png'
  };
  var buddyMood = 'idle';
  var buddyTalkTimer = null;

  function setBuddy(mood, caption) {
    var img = $('buddyImg');
    var vid = $('buddyVideo');
    var frame = $('buddyFrame');
    var cap = $('buddyCaption');
    if (!img || !vid || !frame) return;
    mood = mood || 'idle';
    buddyMood = mood;
    if (cap && caption != null) cap.textContent = caption;
    if (buddyTalkTimer) { clearInterval(buddyTalkTimer); buddyTalkTimer = null; }

    if (mood === 'speaking') {
      frame.classList.add('is-speaking');
      img.classList.add('hidden');
      vid.classList.remove('hidden');
      try {
        var p = vid.play();
        if (p && p.catch) p.catch(function () {
          // Autoplay blocked — flap still images instead.
          vid.classList.add('hidden');
          img.classList.remove('hidden');
          var open = false;
          img.src = BUDDY.idle;
          buddyTalkTimer = setInterval(function () {
            open = !open;
            img.src = open ? BUDDY.talking : BUDDY.idle;
          }, 140);
        });
      } catch (e) {}
      return;
    }

    frame.classList.remove('is-speaking');
    try { vid.pause(); vid.currentTime = 0; } catch (e) {}
    vid.classList.add('hidden');
    img.classList.remove('hidden');
    img.src = BUDDY[mood] || BUDDY.idle;
  }

  /* ------------------------------------------------------------------
   * Teacher voice. Every utterance gets a generation number; anything that
   * finishes late (a slow TTS download, an event from a stopped player) is
   * ignored, so a question is never read twice or by a second voice.
   * ------------------------------------------------------------------ */
  var speechGen = 0;
  var blockedVoice = null; // a question the browser refused to autoplay; read after the first tap
  var ttsEl = null, ttsUrl = '', speechTimer = null, ttsAbort = null, heldVoice = null;
  var playCtx = null, liveVoice = null;
  var VOICE_RATE = 24000;
  var IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  // Browsers only let a page make sound after the user has touched it.
  function wakePlayback() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!playCtx) {
      try { playCtx = new AC({ sampleRate: VOICE_RATE }); }
      catch (e) { try { playCtx = new AC(); } catch (e2) { return; } }
    }
    if (playCtx.state !== 'running') {
      try { var p = playCtx.resume(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    }
  }
  ['pointerdown', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, wakePlayback, { capture: true, passive: true });
  });

  // On iPhone and iPad the silent switch mutes this kind of playback unless the
  // microphone is open, so without the microphone the whole clip is played instead.
  function canStreamVoice() {
    return !!playCtx && playCtx.state === 'running' && (!IS_IOS || hf.on);
  }

  function clearSpeech() {
    heldVoice = null;
    if (liveVoice) {
      liveVoice.sources.forEach(function (src) { src.onended = null; try { src.stop(); } catch (e) {} });
      try { liveVoice.reader.cancel().catch(function () {}); } catch (e) {}
      liveVoice = null;
    }
    if (speechTimer) { clearTimeout(speechTimer); speechTimer = null; }
    if (ttsAbort) { try { ttsAbort.abort(); } catch (e) {} ttsAbort = null; }
    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
    if (ttsEl) {
      ttsEl.onended = null; ttsEl.onerror = null; ttsEl.onplaying = null;
      try { ttsEl.pause(); } catch (e) {}
    }
    if (ttsUrl) { URL.revokeObjectURL(ttsUrl); ttsUrl = ''; }
  }

  function stopSpeech() {
    speechGen++;
    clearSpeech();
  }

  function cancelTypewriter(finishText) {
    if (reveal.timer) { clearInterval(reveal.timer); reveal.timer = null; }
    var done = reveal.onDone;
    reveal.onDone = null;
    if (reveal.typing) {
      reveal.typing = false;
      if (finishText && reveal.full) reveal.shown = reveal.full.length;
      reveal.hideLastAi = false;
      render();
    }
    reveal.gen++;
    if (done) done();
  }

  function startTypewriter(text, thenSpeak) {
    cancelTypewriter(false);
    var gen = ++reveal.gen;
    reveal.full = String(text || '');
    reveal.shown = 0;
    reveal.typing = true;
    reveal.hideLastAi = false;
    reveal.onDone = null;
    render();
    // ~14 chars/sec tracks a natural speaking pace for short teacher lines.
    var ms = Math.max(22, Math.min(55, Math.round(900 / Math.max(8, reveal.full.length / 12))));
    reveal.timer = setInterval(function () {
      if (gen !== reveal.gen) return;
      reveal.shown = Math.min(reveal.full.length, reveal.shown + 1);
      // Patch only the live bubble when possible to avoid rebuilding the whole chat.
      var bubble = document.getElementById('liveAiBubble');
      if (bubble) {
        bubble.innerHTML = esc(reveal.full.slice(0, reveal.shown)) +
          (reveal.shown < reveal.full.length ? '<span class="caret"></span>' : '');
        $('chat').scrollTop = $('chat').scrollHeight;
      } else {
        render();
      }
      if (reveal.shown >= reveal.full.length) {
        clearInterval(reveal.timer); reveal.timer = null;
        reveal.typing = false;
        render();
        var voiceBusy = !!(speechTimer || ttsAbort || liveVoice);
        if (hf.on && (hf.state === 'speaking' || hf.state === 'thinking') && !voiceBusy) {
          setState('listening');
        }
      }
    }, ms);
    if (thenSpeak) thenSpeak();
  }

  function finishSpeech(gen) {
    if (gen !== speechGen) return;
    stopSpeech();
    // Keep the mic closed until the bubble has finished typing.
    if (reveal.typing) return;
    if (hf.on && hf.state === 'speaking') setState('listening');
    else setBuddy('listening', 'Your turn');
  }

  function speechStarted(gen, text) {
    if (gen !== speechGen) return;
    if (hf.on) setState('speaking');
    setBuddy('speaking', 'Salt is talking…');
    if (speechTimer) clearTimeout(speechTimer);
    speechTimer = setTimeout(function () { finishSpeech(gen); }, 8000 + String(text).length * 120);
  }

  function pickBrowserVoice() {
    if (!('speechSynthesis' in window)) return null;
    if (preferredVoice) return preferredVoice;
    var voices = window.speechSynthesis.getVoices() || [];
    if (!voices.length) return null;
    var score = function (v) {
      var n = ((v.name || '') + ' ' + (v.voiceURI || '')).toLowerCase();
      var lang = String(v.lang || '').toLowerCase();
      var s = 0;
      if (lang.indexOf('en') === 0) s += 10;
      if (lang === 'en-us' || lang === 'en_us') s += 4;
      if (/natural|neural|premium|enhanced|online/.test(n)) s += 8;
      if (/google|microsoft|samantha|karen|moira|ava|jenny|aria|sara|susan|zira/.test(n)) s += 6;
      if (/female|woman|girl/.test(n)) s += 2;
      if (/male|man|david|mark|fred|daniel|grandpa|elderly/.test(n)) s -= 4;
      if (v.localService === false) s += 2;
      return s;
    };
    preferredVoice = voices.slice().sort(function (a, b) { return score(b) - score(a); })[0] || null;
    return preferredVoice;
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = function () { preferredVoice = null; pickBrowserVoice(); };
  }

  function speakBrowser(text, gen) {
    if (gen !== speechGen) return;
    if (!('speechSynthesis' in window)) { finishSpeech(gen); return; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 1.05;
      u.pitch = 1.05;
      var v = pickBrowserVoice();
      if (v) u.voice = v;
      u.onend = function () { finishSpeech(gen); };
      u.onerror = function () { finishSpeech(gen); };
      window.speechSynthesis.speak(u);
      speechStarted(gen, text);
    } catch (e) { finishSpeech(gen); }
  }

  function playVoice(gen, text, blob) {
    if (gen !== speechGen) return;
    if (!ttsEl) ttsEl = new Audio();
    ttsUrl = URL.createObjectURL(blob);
    ttsEl.onplaying = function () { speechStarted(gen, text); };
    ttsEl.onended = function () { finishSpeech(gen); };
    ttsEl.onerror = function () { finishSpeech(gen); };
    ttsEl.src = ttsUrl;
    var played = ttsEl.play();
    // A blocked or interrupted player ends quietly; it must not start a second voice.
    if (played && played.catch) played.catch(function (err) {
      if (gen === speechGen && err && err.name === 'NotAllowedError') blockedVoice = { text: text, blob: blob };
      finishSpeech(gen);
    });
  }

  function playHeldVoice() {
    var held = heldVoice;
    heldVoice = null;
    if (held && $('ttsToggle').checked) held.resume();
  }

  // The student may have started talking while the voice was loading. The voice
  // waits until we know whether that was an answer (drop it) or a noise (play it).
  // Returns true when the voice may start now.
  function voiceMayStart(gen, resume) {
    if (gen !== speechGen) return false;
    if (!$('ttsToggle').checked || (hf.on && hf.state === 'thinking')) { stopSpeech(); return false; }
    if (hf.on && hf.state === 'hearing') { heldVoice = { resume: resume }; return false; }
    return true;
  }

  function wavBlob(pcm, rate) {
    var head = new DataView(new ArrayBuffer(44));
    var str = function (o, t) { for (var k = 0; k < t.length; k++) head.setUint8(o + k, t.charCodeAt(k)); };
    str(0, 'RIFF'); head.setUint32(4, 36 + pcm.byteLength, true); str(8, 'WAVE'); str(12, 'fmt ');
    head.setUint32(16, 16, true); head.setUint16(20, 1, true); head.setUint16(22, 1, true);
    head.setUint32(24, rate, true); head.setUint32(28, rate * 2, true);
    head.setUint16(32, 2, true); head.setUint16(34, 16, true); str(36, 'data'); head.setUint32(40, pcm.byteLength, true);
    return new Blob([head, pcm], { type: 'audio/wav' });
  }

  function wholeVoice(gen, text, blob) {
    if (gen !== speechGen) return;
    ttsAbort = null;
    if (voiceMayStart(gen, function () { playVoice(gen, text, blob); })) playVoice(gen, text, blob);
  }

  /* Plays the voice while it is still downloading. */
  function streamVoice(gen, text, reader, ctx, rate) {
    var v = { reader: reader, sources: [], queue: [], queued: 0, live: 0, next: 0, started: false, done: false, carry: null };
    liveVoice = v;

    function schedule() {
      if (!v.queued) return;
      var buf = ctx.createBuffer(1, v.queued, rate);
      var ch = buf.getChannelData(0), off = 0;
      v.queue.forEach(function (part) { ch.set(part, off); off += part.length; });
      v.queue = []; v.queued = 0;
      var src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      var at = Math.max(v.next, ctx.currentTime + 0.03);
      src.start(at);
      v.next = at + buf.duration;
      v.live++;
      v.sources.push(src);
      src.onended = function () {
        v.live--;
        v.sources.splice(v.sources.indexOf(src), 1);
        if (v.done && !v.live && !v.queued) finishSpeech(gen);
      };
    }

    function pump() {
      if (gen !== speechGen) return;
      if (!v.started) {
        // A short head start so playback does not run dry on a slow connection.
        if (!v.done && v.queued < rate * 0.25) return;
        if (!voiceMayStart(gen, pump)) return;
        if (!v.queued) { finishSpeech(gen); return; }
        v.started = true;
        v.next = ctx.currentTime + 0.05;
        speechStarted(gen, text);
      }
      // After running dry, wait for a little more audio rather than stutter.
      var ranDry = v.next <= ctx.currentTime + 0.02;
      if (v.done || v.queued >= rate * (ranDry ? 0.3 : 0.12)) schedule();
      if (v.done && !v.live && !v.queued) finishSpeech(gen);
    }

    function addBytes(bytes) {
      if (v.carry) {
        var joined = new Uint8Array(bytes.length + 1);
        joined[0] = v.carry[0]; joined.set(bytes, 1);
        bytes = joined; v.carry = null;
      }
      if (bytes.length % 2) { v.carry = bytes.slice(bytes.length - 1); bytes = bytes.subarray(0, bytes.length - 1); }
      if (!bytes.length) return;
      var view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      var out = new Float32Array(bytes.length / 2);
      for (var i = 0; i < out.length; i++) out[i] = view.getInt16(i * 2, true) / 32768;
      v.queue.push(out); v.queued += out.length;
    }

    function step(res) {
      if (gen !== speechGen) return;
      if (res.done) { v.done = true; ttsAbort = null; pump(); return; }
      addBytes(res.value);
      pump();
      return reader.read().then(step);
    }
    // A stream that breaks part-way plays what arrived; it never starts a second voice.
    return reader.read().then(step).catch(function () {
      if (gen !== speechGen) return;
      v.done = true; ttsAbort = null; pump();
    });
  }

  function speak(text) {
    stopSpeech();
    blockedVoice = null;
    if (!$('ttsToggle').checked || !text) return;
    var gen = speechGen;
    if (!ttsConfigured) { speakBrowser(text, gen); return; }

    var token = getToken(role);
    ttsAbort = window.AbortController ? new AbortController() : null;
    fetch('/api/student/debrief/tts', {
      method: 'POST',
      headers: {
        Accept: 'application/octet-stream, audio/*, application/json',
        'Content-Type': 'application/json',
        Authorization: token ? ('Bearer ' + token) : ''
      },
      body: JSON.stringify({ text: text, stream: true }),
      signal: ttsAbort ? ttsAbort.signal : undefined
    }).then(function (r) {
      if (!r.ok) throw new Error('tts');
      return r;
    }).then(function (r) {
      if (gen !== speechGen) return;
      if (r.headers.get('X-Audio-Format') !== 'pcm16le') {
        return r.blob().then(function (blob) { wholeVoice(gen, text, blob); });
      }
      var rate = Number(r.headers.get('X-Audio-Sample-Rate')) || VOICE_RATE;
      if (canStreamVoice() && r.body && r.body.getReader) {
        return streamVoice(gen, text, r.body.getReader(), playCtx, rate);
      }
      return r.arrayBuffer().then(function (pcm) { wholeVoice(gen, text, wavBlob(pcm, rate)); });
    }, function () {
      // Only a failed TTS request falls back to the device voice.
      if (gen === speechGen) { ttsAbort = null; speakBrowser(text, gen); }
    }).catch(function () { finishSpeech(gen); });
  }

  /* ------------------------------------------------------------------
   * Hands-free conversation. The microphone stays open; speech is detected
   * on the device, and each finished utterance is sent as one answer.
   * ------------------------------------------------------------------ */
  var VAD = {
    startMs: 160,          // voiced audio needed before an answer starts
    preRollMs: 500,        // audio kept from before the start, so first words are not clipped
    endSilenceMs: 1800,    // pause that ends an answer
    endSilenceShortMs: 2600, // longer patience right after a short start ("Um...")
    shortAnswerMs: 1500,
    minVoicedMs: 450,      // less voiced audio than this is treated as noise
    maxMs: 90000,
    tailMs: 350,           // silence kept after the last word
    minStart: 0.014,       // RMS floors (full scale = 1)
    minContinue: 0.008,
    startFactor: 3.5,      // multiples of the measured room noise
    continueFactor: 2.0,
    targetRate: 16000
  };

  var hf = {
    on: false, state: 'off',
    ctx: null, stream: null, source: null, node: null, sink: null, rate: 48000,
    pre: [], preMs: 0, seg: [], segMs: 0,
    voicedRunMs: 0, voicedMs: 0, silenceMs: 0, lastVoicedSegMs: 0,
    floor: 0.003, level: 0, misses: 0, starting: false, deafUntil: 0
  };

  var STATE_TEXT = {
    off: ['Start talking', 'Tap the microphone once. After that, just talk — no more tapping.'],
    listening: ['Listening', 'Go ahead — I am listening.'],
    hearing: ['I hear you', 'Pause when you are done, or tap to send now.'],
    thinking: ['Thinking', 'Understanding your answer…'],
    speaking: ['Teacher is speaking', 'Tap to skip and answer.']
  };

  function refreshMic() {
    var btn = $('micBtn');
    var st = hf.on ? hf.state : 'off';
    ['off', 'listening', 'hearing', 'thinking', 'speaking'].forEach(function (c) { btn.classList.toggle(c, c === st); });
    btn.disabled = !sttConfigured || !sessionActive() || hf.starting || st === 'thinking' || (!hf.on && busy);
    var icon = st === 'off' ? 'fa-microphone' : st === 'speaking' ? 'fa-volume-high'
      : st === 'thinking' ? 'fa-ellipsis' : st === 'hearing' ? 'fa-paper-plane' : 'fa-microphone-lines';
    btn.innerHTML = '<i class="fa-solid ' + icon + '"></i>';
    btn.setAttribute('aria-label', STATE_TEXT[st][0]);
    $('micLabel').textContent = sttConfigured && sessionActive() ? STATE_TEXT[st][0] : '';
    if (st !== 'listening' && st !== 'hearing') btn.style.setProperty('--level', '0');
  }

  function setState(st, hint, isError) {
    // Skip the tail of the teacher's voice still ringing in the room.
    if (st === 'listening' && hf.state === 'speaking') hf.deafUntil = Date.now() + 300;
    hf.state = st;
    if (st === 'listening') {
      hf.pre = []; hf.preMs = 0; hf.seg = []; hf.segMs = 0;
      hf.voicedRunMs = 0; hf.voicedMs = 0; hf.silenceMs = 0; hf.lastVoicedSegMs = 0;
    }
    if (st === 'listening') setBuddy('listening', 'Listening…');
    else if (st === 'hearing') setBuddy('listening', 'I hear you');
    else if (st === 'thinking') setBuddy('thinking', 'Thinking…');
    else if (st === 'speaking') setBuddy('speaking', 'Salt is talking…');
    else if (st === 'off') setBuddy('idle', 'Ready when you are');
    refreshMic();
    if (hint !== undefined) setHint(hint, isError);
    else if (hf.on) setHint(STATE_TEXT[st][1]);
  }

  function rms(buf) {
    var sum = 0;
    for (var i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    return Math.sqrt(sum / (buf.length || 1));
  }

  function onAudioFrame(buf) {
    if (!hf.on || (hf.state !== 'listening' && hf.state !== 'hearing')) return;
    if (hf.state === 'listening' && Date.now() < hf.deafUntil) return;
    var ms = buf.length / hf.rate * 1000;
    var level = rms(buf);
    hf.level = hf.level * 0.6 + level * 0.4;
    $('micBtn').style.setProperty('--level', Math.min(1, hf.level * 12).toFixed(2));

    var startThr = Math.max(VAD.minStart, hf.floor * VAD.startFactor);
    var contThr = Math.max(VAD.minContinue, hf.floor * VAD.continueFactor);

    if (hf.state === 'listening') {
      hf.pre.push(buf); hf.preMs += ms;
      while (hf.preMs - (hf.pre[0].length / hf.rate * 1000) > VAD.preRollMs) {
        hf.preMs -= hf.pre[0].length / hf.rate * 1000;
        hf.pre.shift();
      }
      if (level >= startThr) {
        hf.voicedRunMs += ms;
      } else {
        hf.voicedRunMs = Math.max(0, hf.voicedRunMs - ms * 2);
        hf.floor = Math.min(0.05, Math.max(0.0005, hf.floor * 0.95 + level * 0.05));
      }
      if (hf.voicedRunMs >= VAD.startMs) {
        hf.seg = hf.pre; hf.segMs = hf.preMs;
        hf.pre = []; hf.preMs = 0;
        hf.voicedMs = hf.voicedRunMs; hf.silenceMs = 0; hf.lastVoicedSegMs = hf.segMs;
        setState('hearing');
      }
      return;
    }

    hf.seg.push(buf); hf.segMs += ms;
    if (level >= contThr) {
      hf.voicedMs += ms; hf.silenceMs = 0; hf.lastVoicedSegMs = hf.segMs;
    } else {
      hf.silenceMs += ms;
    }
    var patience = hf.voicedMs < VAD.shortAnswerMs ? VAD.endSilenceShortMs : VAD.endSilenceMs;
    if (hf.silenceMs >= patience || hf.segMs >= VAD.maxMs) finishUtterance();
  }

  function encodeWav(chunks, rate, keepMs) {
    var total = 0, i, j;
    for (i = 0; i < chunks.length; i++) total += chunks[i].length;
    var keep = Math.min(total, Math.ceil(keepMs / 1000 * rate));
    var ratio = rate / VAD.targetRate;
    var outLen = Math.floor(keep / ratio);
    var flat = new Float32Array(keep), off = 0;
    for (i = 0; i < chunks.length && off < keep; i++) {
      var c = chunks[i], n = Math.min(c.length, keep - off);
      flat.set(n === c.length ? c : c.subarray(0, n), off);
      off += n;
    }
    var view = new DataView(new ArrayBuffer(44 + outLen * 2));
    var str = function (o, t) { for (var k = 0; k < t.length; k++) view.setUint8(o + k, t.charCodeAt(k)); };
    str(0, 'RIFF'); view.setUint32(4, 36 + outLen * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, VAD.targetRate, true); view.setUint32(28, VAD.targetRate * 2, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true); str(36, 'data'); view.setUint32(40, outLen * 2, true);
    // Averaging each block of input samples is a cheap low-pass before dropping to 16 kHz.
    for (i = 0; i < outLen; i++) {
      var from = Math.floor(i * ratio), to = Math.max(from + 1, Math.floor((i + 1) * ratio)), acc = 0;
      for (j = from; j < to && j < keep; j++) acc += flat[j];
      var v = Math.max(-1, Math.min(1, acc / (to - from)));
      view.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7FFF, true);
    }
    return new Blob([view], { type: 'audio/wav' });
  }

  function finishUtterance() {
    if (hf.state !== 'hearing') return;
    if (hf.voicedMs < VAD.minVoicedMs) { setState('listening'); playHeldVoice(); return; }
    var blob = encodeWav(hf.seg, hf.rate, hf.lastVoicedSegMs + VAD.tailMs);
    hf.seg = [];
    sendAudio(blob);
  }

  async function sendAudio(blob) {
    stopSpeech();
    setState('thinking');
    setBusy(true); render();
    var res, data = {};
    try {
      var fd = new FormData();
      fd.append('audio', blob, 'answer.wav');
      var token = getToken(role);
      res = await fetch('/api/student/debrief/sessions/' + encodeURIComponent(session.id) + '/audio', {
        method: 'POST',
        headers: { Accept: 'application/json', Authorization: token ? ('Bearer ' + token) : '' },
        body: fd
      });
      data = await res.json().catch(function () { return {}; });
    } catch (e) {
      res = null;
    }
    setBusy(false);
    if (res && res.status === 401) { location.replace('/'); return; }
    if (res && res.ok) {
      hf.misses = 0;
      applyResult(data, true);
      return;
    }
    render();
    var msg;
    if (res && res.status === 422) {
      hf.misses++;
      msg = hf.misses >= 2
        ? 'Still hard to hear you. Move closer to the microphone, then try again.'
        : "I didn't catch that. Please say it again.";
    } else if (res && res.status === 429) {
      msg = 'The voice service is busy. Wait a few seconds and say it again, then try again.';
    } else {
      msg = (data && data.error) || 'Could not send your answer. Please say it again then try again.';
    }
    if (hf.on) setState('listening', msg, true); else setHint(msg, true);
  }

  var WORKLET_SRC = 'class C extends AudioWorkletProcessor{constructor(){super();this.b=new Float32Array(1024);this.n=0}' +
    'process(i){var c=i[0]&&i[0][0];if(c){for(var k=0;k<c.length;k++){this.b[this.n++]=c[k];' +
    'if(this.n===1024){this.port.postMessage(this.b);this.b=new Float32Array(1024);this.n=0}}}return true}}' +
    'registerProcessor("debrief-capture",C)';

  async function startHandsFree() {
    if (hf.on || hf.starting || !sessionActive()) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !AC) {
      setHint('This browser cannot use the microphone. Please use the microphone.', true);
      return;
    }
    hf.starting = true; refreshMic();
    try {
      hf.stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
      });
    } catch (e) {
      hf.starting = false; refreshMic();
      setHint('Microphone permission is needed. Please allow the microphone to continue.', true);
      return;
    }
    try {
      hf.ctx = new AC();
      if (hf.ctx.state === 'suspended') await hf.ctx.resume();
      hf.rate = hf.ctx.sampleRate;
      hf.source = hf.ctx.createMediaStreamSource(hf.stream);
      hf.sink = hf.ctx.createGain();
      hf.sink.gain.value = 0;
      hf.sink.connect(hf.ctx.destination);
      var worklet = false;
      if (hf.ctx.audioWorklet && window.AudioWorkletNode) {
        try {
          var url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'application/javascript' }));
          await hf.ctx.audioWorklet.addModule(url);
          URL.revokeObjectURL(url);
          hf.node = new AudioWorkletNode(hf.ctx, 'debrief-capture');
          hf.node.port.onmessage = function (ev) { onAudioFrame(ev.data); };
          worklet = true;
        } catch (e) { worklet = false; }
      }
      if (!worklet) {
        hf.node = hf.ctx.createScriptProcessor(2048, 1, 1);
        hf.node.onaudioprocess = function (ev) { onAudioFrame(new Float32Array(ev.inputBuffer.getChannelData(0))); };
      }
      hf.source.connect(hf.node);
      hf.node.connect(hf.sink);
      hf.stream.getAudioTracks().forEach(function (t) {
        t.onended = function () { if (hf.on) { stopSpeech(); stopHandsFree('Microphone stopped. Tap it to talk again.', true); } };
      });
    } catch (e) {
      hf.starting = false;
      stopHandsFree('Could not start the microphone. Please use the microphone.', true);
      return;
    }
    hf.starting = false;
    hf.on = true; hf.misses = 0; hf.floor = 0.003;
    // A question that is already being read keeps playing; listening starts when it ends.
    var teacherTalking = !!speechTimer;
    setState(teacherTalking ? 'speaking' : 'listening');
    if (blockedVoice && $('ttsToggle').checked) {
      var b = blockedVoice;
      blockedVoice = null;
      stopSpeech();
      playVoice(speechGen, b.text, b.blob);
    }
  }

  function stopHandsFree(hint, isError) {
    hf.on = false; hf.state = 'off';
    try { if (hf.node) { hf.node.disconnect(); if (hf.node.port) hf.node.port.onmessage = null; hf.node.onaudioprocess = null; } } catch (e) {}
    try { if (hf.source) hf.source.disconnect(); } catch (e) {}
    try { if (hf.stream) hf.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    try { if (hf.ctx && hf.ctx.state !== 'closed') hf.ctx.close(); } catch (e) {}
    hf.node = hf.source = hf.stream = hf.ctx = hf.sink = null;
    hf.pre = []; hf.seg = [];
    refreshMic();
    if (hint !== undefined) setHint(hint, isError);
  }

  function onMicTap() {
    if (!hf.on) { startHandsFree(); return; }
    if (hf.state === 'speaking') {
      stopSpeech();
      if (reveal.typing) { reveal.shown = reveal.full.length; cancelTypewriter(true); }
      setState('listening');
    }
    else if (hf.state === 'hearing') { hf.silenceMs = 0; finishUtterance(); }
    else if (hf.state === 'listening') { stopSpeech(); stopHandsFree('Microphone is off. Tap it to talk again, then try again.'); }
  }

  function render() {
    var chat = $('chat');
    var html = '';
    var turns = session.turns || [];
    turns.forEach(function (t, idx) {
      var isAi = t.role === 'ai';
      var isLast = idx === turns.length - 1;
      if (reveal.hideLastAi && isLast && isAi) return;
      var text = t.text;
      var live = false;
      if (reveal.typing && isLast && isAi) {
        text = reveal.full.slice(0, reveal.shown);
        live = true;
      }
      html += '<div class="msg ' + (isAi ? 'ai' : 'student') + '"><div>' +
        '<div class="who">' + (isAi ? 'Teacher' : 'You') + '</div>' +
        '<div class="bubble"' + (live ? ' id="liveAiBubble"' : '') + '>' + esc(text) +
        (live && reveal.shown < reveal.full.length ? '<span class="caret"></span>' : '') +
        '</div></div></div>';
    });
    if (busy || reveal.hideLastAi) html += '<div class="thinking"><i class="fa-solid fa-ellipsis fa-fade"></i> Thinking…</div>';
    if (session.status === 'completed') {
      html += '<div class="done-card"><strong>Session complete.</strong><br>' +
        (session.reportReleased && session.grade
          ? 'Your teacher released your report below.'
          : 'Great job! Your teacher will review your conversation and share your report.') +
        '<br><br><a class="btn btn-primary" href="/student.html" style="text-decoration:none;display:inline-block">Back to home</a></div>';
      if (session.reportReleased && session.grade) html += renderReport(session.grade);
    }
    chat.innerHTML = html;
    chat.scrollTop = chat.scrollHeight;

    var total = session.planTotal || 0;
    var pct = session.status === 'completed' ? 100 : (total ? Math.min(95, Math.round((session.planAsked - 1) / total * 100)) : 5);
    $('progressBar').style.width = pct + '%';
    $('dock').classList.toggle('hidden', session.status === 'completed');
    $('micRow').classList.toggle('hidden', !sttConfigured);
    if (session.status === 'completed') setBuddy('happy', 'Great job!');
    refreshMic();
  }

  var DIM_LABELS = { comprehension: 'Understanding the story', evidence: 'Using evidence', criticalThinking: 'Thinking critically', oralFluency: 'Speaking fluency' };
  function pips(n) { return n == null ? '—' : '●'.repeat(n) + '○'.repeat(4 - n); }
  function renderReport(g) {
    var html = '<div class="report"><h2><span>Your Oral Debrief Report</span><span class="score">' +
      (g.total != null ? esc(g.total) + '<small style="font-size:.9rem;color:var(--muted)">/100</small>' : '') + '</span></h2>';
    ['comprehension', 'evidence', 'criticalThinking', 'oralFluency'].forEach(function (k) {
      var d = (g.dimensions || {})[k];
      if (!d || d.score == null) return;
      html += '<div class="dim"><div class="row"><span>' + DIM_LABELS[k] + '</span><span class="pips">' + pips(d.score) + '</span></div>' +
        (d.rationale ? '<p>' + esc(d.rationale) + '</p>' : '') + '</div>';
    });
    if ((g.strengths || []).length) html += '<h3>What you did well</h3><ul>' + g.strengths.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    if ((g.improvements || []).length) html += '<h3>Next time, try</h3><ul>' + g.improvements.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    if (g.studentFeedback) html += '<div class="feedback">' + esc(g.studentFeedback) + '</div>';
    return html + '</div>';
  }

  function applyResult(data, speakReply) {
    if (data.session) session = data.session;
    var reply = (speakReply && data.reply) ? String(data.reply) : '';
    var done = !sessionActive();
    if (done && hf.on) stopHandsFree('');

    if (!reply) {
      reveal.hideLastAi = false;
      cancelTypewriter(true);
      render();
      if (hf.on && sessionActive()) setState('listening');
      return;
    }

    // 1) Show the student's transcript first (hide the new AI turn briefly).
    reveal.hideLastAi = true;
    cancelTypewriter(false);
    render();
    if (hf.on && sessionActive()) setState('thinking', 'Teacher is thinking…');

    var delay = done ? 400 : 700;
    setTimeout(function () {
      if (!session) return;
      // 2) Reveal the AI bubble by typing while the voice plays.
      startTypewriter(reply, function () { speak(reply); });
      if (hf.on && sessionActive()) setState('speaking');
    }, delay);
  }

  $('micBtn').addEventListener('click', onMicTap);
  $('ttsToggle').addEventListener('change', function () {
    if ($('ttsToggle').checked) return;
    stopSpeech();
    if (hf.on && hf.state === 'speaking') setState('listening');
  });
  window.addEventListener('pagehide', function () { stopSpeech(); cancelTypewriter(false); if (hf.on) stopHandsFree(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !hf.on || !hf.ctx) return;
    // Phones suspend audio capture in the background; pick it back up on return.
    if (hf.ctx.state !== 'running') hf.ctx.resume().catch(function () {
      stopHandsFree('Microphone stopped. Tap it to talk again.', true);
    });
  });
  $('endBtn').addEventListener('click', async function () {
    if (!session || busy) return;
    if (!confirm('Finish the session now? You cannot restart it.')) return;
    stopSpeech();
    if (hf.on) stopHandsFree('');
    setBusy(true);
    try {
      session = await api('/api/student/debrief/sessions/' + encodeURIComponent(session.id) + '/end',
        { method: 'POST' }, role);
      setBusy(false); render();
    } catch (e) { setBusy(false); setHint(e.message, true); }
  });

  async function boot() {
    setBuddy('idle', 'Ready when you are');
    if (!assignmentId) {
      $('chat').innerHTML = '<div class="error-card">No assignment selected.</div>';
      $('dock').classList.add('hidden');
      return;
    }
    wakePlayback();
    try {
      var meta = await api('/api/student/debrief/meta', {}, role);
      sttConfigured = !!meta.sttConfigured;
      ttsConfigured = !!meta.ttsConfigured;
      session = await api('/api/student/debrief/assignments/' + encodeURIComponent(assignmentId) + '/session',
        { method: 'POST' }, role);
      render();
      if (!sttConfigured) {
        setHint('Voice recognition is not available right now. Please try again later.', true);
        $('micRow').classList.add('hidden');
      } else {
        setHint(STATE_TEXT.off[1]);
      }
      var last = session.turns[session.turns.length - 1];
      if (session.status === 'active' && last && last.role === 'ai' && session.turns.length === 1) {
        startTypewriter(last.text, function () { speak(last.text); });
      }
    } catch (e) {
      $('chat').innerHTML = '<div class="error-card">' + esc(e.message || 'Could not start.') + '</div>';
      $('dock').classList.add('hidden');
    }
  }
  boot();
})();
</script>
</body>
</html>
