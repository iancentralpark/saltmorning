<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Online Lessons — Salt Morning</title>
  <meta name="theme-color" content="#0D2748">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20260818">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root { --ink:#16233a; --muted:#5d6b82; --line:#d7e0ee; --navy:#0D2748; --teal:#12806f; --teal-soft:#e4f4f0; --coral:#c24a40; --paper:#f3f6fb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, 'Noto Sans KR', sans-serif; color:var(--ink); background:var(--paper); }
    .hidden { display:none !important; }
    header { background:var(--navy); color:#fff; padding:.7rem 1rem; display:flex; align-items:center; gap:.75rem; padding-top:calc(.7rem + env(safe-area-inset-top)); }
    header a { color:#cfe0f5; text-decoration:none; font-size:.9rem; }
    header .title { font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    main { max-width:960px; margin:0 auto; padding:1rem; }
    .player { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:14px; overflow:hidden; }
    .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
    .info { background:#fff; border:1px solid var(--line); border-radius:14px; padding:.9rem 1rem; margin:.8rem 0; }
    .info h1 { margin:0 0 .3rem; font-size:1.15rem; }
    .info p { margin:.2rem 0; color:var(--muted); line-height:1.5; white-space:pre-wrap; }
    .bar { height:6px; background:#dfe7f3; border-radius:999px; overflow:hidden; margin-top:.6rem; }
    .bar > div { height:100%; background:var(--teal); width:0; transition:width .4s; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:.5rem; flex-wrap:wrap; margin-top:.5rem; font-size:.85rem; color:var(--muted); }
    .speed {
      display:grid; grid-template-columns:auto minmax(0, 1fr); gap:.2rem .75rem; align-items:center;
      margin-top:.75rem; padding-top:.7rem; border-top:1px solid var(--line);
      font-size:.85rem; color:var(--muted);
    }
    .speed label { grid-row:1 / span 2; font-weight:700; color:var(--ink); white-space:nowrap; }
    .speed label strong { color:var(--teal); font-variant-numeric:tabular-nums; }
    .speed input[type=range] {
      width:100%; margin:0; accent-color:var(--teal); height:1.35rem; cursor:pointer;
    }
    .speed .ends { display:flex; justify-content:space-between; font-size:.72rem; font-weight:600; }
    .btn { border:none; border-radius:10px; padding:.45rem .85rem; font:inherit; font-weight:700; cursor:pointer; background:var(--navy); color:#fff; }
    .btn.ghost { background:#fff; color:var(--navy); border:1px solid var(--line); }
    h2 { font-size:1rem; color:var(--navy); margin:1.2rem 0 .5rem; }
    .list { list-style:none; margin:0; padding:0; display:grid; gap:.5rem; }
    .list a { display:grid; grid-template-columns:2rem 1fr auto; gap:.6rem; align-items:center; background:#fff; border:1px solid var(--line); border-radius:12px; padding:.65rem .8rem; color:inherit; text-decoration:none; }
    .list a.current { border-color:var(--teal); background:var(--teal-soft); }
    .list .no { font-weight:800; color:var(--navy); text-align:center; }
    .list .t { font-weight:600; }
    .list .m { font-size:.8rem; color:var(--muted); }
    .done { color:var(--teal); font-weight:700; font-size:.85rem; }
    .info p.hint { font-size:.8rem; margin:.35rem 0 0; white-space:normal; }
    .manual { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin-top:.7rem; padding:.6rem .75rem; border:1px solid var(--line); border-radius:10px; background:var(--paper); font-size:.82rem; color:var(--muted); line-height:1.45; }
    .manual span { flex:1 1 14rem; }
    .list a.locked { opacity:.65; }
    .list .m.late { color:var(--coral); font-weight:600; }
    .error-card { background:#fdeceb; border:1px solid #f3c5c1; color:var(--coral); border-radius:14px; padding:1rem; margin:1rem 0; }
    .empty { text-align:center; color:var(--muted); padding:2rem 1rem; }
  </style>
</head>
<body>
  <header>
    <a href="/student.html"><i class="fa-solid fa-chevron-left"></i> Back</a>
    <div class="title" id="titleText">Online Lessons</div>
  </header>
  <main>
    <div id="playerArea" class="hidden">
      <div class="player"><iframe id="playerFrame" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
      <div class="info">
        <h1 id="lessonTitle"></h1>
        <p id="lessonDesc"></p>
        <div class="bar"><div id="watchBar"></div></div>
        <div class="row">
          <span id="watchText"></span>
        </div>
        <div class="speed hidden" id="speedRow">
          <label for="speedSlider">Speed <strong id="speedLabel">1.0×</strong></label>
          <input type="range" id="speedSlider" min="0.8" max="2" step="0.1" value="1" aria-valuemin="0.8" aria-valuemax="2" aria-valuenow="1" aria-label="Playback speed">
          <div class="ends" aria-hidden="true"><span>0.8×</span><span>2×</span></div>
        </div>
        <p class="hint" id="watchHint"></p>
        <div class="manual hidden" id="manualArea">
          <span>The video player could not report your progress on this device. If you watched the whole lesson, mark it here. Your teacher will see that you marked it yourself.</span>
          <button type="button" class="btn ghost" id="markDoneBtn">Mark as watched</button>
        </div>
      </div>
    </div>
    <div id="errorArea" class="error-card hidden"></div>
    <h2 id="listHeading">All lessons</h2>
    <ul class="list" id="lessonList"></ul>
    <div class="empty hidden" id="emptyMsg">No lessons have been shared with your class yet.</div>
  </main>

<script src="/js/app.js?v=20260917session1"></script>
<script>
(function () {
  'use strict';
  var role = 'student';
  var api = SaltApp.api, getToken = SaltApp.getToken, esc = SaltApp.escapeHtml;
  var $ = function (id) { return document.getElementById(id); };
  if (!getToken(role)) { location.replace('/'); return; }

  var HEARTBEAT_MS = 15000;
  var SPEED_KEY = 'salt_olm_playback_rate';
  var SPEED_MIN = 0.8;
  var SPEED_MAX = 2;
  var lessonId = new URLSearchParams(location.search).get('lesson') || '';
  var lesson = null;
  var player = null;
  var playing = false;
  var reachedEnd = false;
  var lastSentAt = 0;

  function clampSpeed(r) {
    r = Math.round(Number(r) * 10) / 10;
    if (!isFinite(r)) return 1;
    return Math.min(SPEED_MAX, Math.max(SPEED_MIN, r));
  }

  function preferredSpeed() {
    try { return clampSpeed(localStorage.getItem(SPEED_KEY) || 1); } catch (e) { return 1; }
  }

  function renderSpeed(r) {
    r = clampSpeed(r);
    if ($('speedSlider')) {
      $('speedSlider').value = String(r);
      $('speedSlider').setAttribute('aria-valuenow', String(r));
    }
    if ($('speedLabel')) $('speedLabel').textContent = r.toFixed(1) + '×';
  }

  /** Apply a playback rate to the player (and remember it for the next lesson). */
  function setSpeed(r) {
    r = clampSpeed(r);
    renderSpeed(r);
    try { localStorage.setItem(SPEED_KEY, String(r)); } catch (e) {}
    if (!player) return;
    try { player.playbackRate = r; } catch (e) {}
  }

  // Only video that actually plays counts. `seg` is the stretch being played right now,
  // `pending` holds finished stretches [fromSec, toSec, speed] the server has not confirmed.
  var MAX_RANGES = 60;
  var seg = null;
  var pending = [];
  var busy = false;
  var queued = null;

  function fmt(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function fmtWhen(ms) {
    var d = new Date(ms);
    var day = d.toLocaleDateString('en-GB', { timeZone: 'Asia/Seoul', weekday: 'short', day: 'numeric', month: 'short' });
    var time = d.toLocaleTimeString('en-GB', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit' });
    return time === '23:59' ? day : day + ', ' + time;
  }

  function showError(msg) {
    var el = $('errorArea');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function renderProgress() {
    if (!lesson) return;
    var pct = lesson.percent || 0;
    $('watchBar').style.width = (lesson.completed ? 100 : pct) + '%';
    var text;
    if (lesson.completed) text = 'Completed';
    else if (reachedEnd) text = pct + '% watched — you skipped some parts. Go back and watch them to finish.';
    else text = pct + '% watched';
    $('watchText').textContent = text;
    var hint = '';
    if (!lesson.completed) {
      hint = 'This lesson is finished once you have watched 90% of it. Skipping ahead does not count.';
      if (lesson.dueAt) hint = (lesson.overdue ? 'Overdue — was due ' : 'Due ') + fmtWhen(lesson.dueAt) + '. ' + hint;
    }
    $('watchHint').textContent = hint;
    if (lesson.completed) $('manualArea').classList.add('hidden');
  }

  function speed() {
    var r = player ? Number(player.playbackRate) : preferredSpeed();
    return r > 0 ? clampSpeed(r) : 1;
  }

  function position() {
    var t = player ? Number(player.currentTime) : 0;
    return isFinite(t) && t > 0 ? t : 0;
  }

  function openSeg(at) {
    var t = at == null ? position() : at;
    seg = { from: t, to: t, rate: speed(), wallAt: Date.now() };
  }

  function closeSeg() {
    if (seg && seg.to - seg.from >= 0.2) {
      pending.push([Math.round(seg.from * 100) / 100, Math.round(seg.to * 100) / 100, seg.rate]);
    }
    seg = null;
  }

  /** Follow the playhead. A jump (seek) ends the current stretch and starts a new one. */
  function advance() {
    if (!playing || !player) return;
    var t = Number(player.currentTime);
    if (!isFinite(t)) return;
    if (!seg) { openSeg(t); return; }
    var wall = (Date.now() - seg.wallAt) / 1000;
    var step = t - seg.to;
    if (step < -0.3 || step > wall * seg.rate * 1.25 + 1) {
      closeSeg();
      openSeg(t);
      return;
    }
    if (step > 0) seg.to = t;
    seg.wallAt = Date.now();
  }

  /** Report progress. Stretches stay in `pending` until the server has accepted them. */
  function send(extra, leaving) {
    if (!lessonId || !lesson) return Promise.resolve();
    if (busy && !leaving) {
      // One report at a time; fold this one into the next.
      queued = Object.assign(queued || {}, extra || {});
      return Promise.resolve();
    }
    if (seg) {
      // Cut the running stretch so everything played so far is included.
      var at = seg.to;
      closeSeg();
      if (playing) openSeg(at);
    }
    var batch = pending.filter(function (r) { return !r.sent; }).slice(0, MAX_RANGES);
    batch.forEach(function (r) { r.sent = true; });
    var body = Object.assign({
      position: position(),
      duration: player ? player.duration : undefined,
      playbackRate: speed(),
      ranges: batch
    }, extra || {});
    lastSentAt = Date.now();
    if (!leaving) busy = true;
    return api('/api/student/lms/lessons/' + encodeURIComponent(lessonId) + '/progress',
      { method: 'POST', body: body, keepalive: !!leaving }, role)
      .then(function (l) {
        pending = pending.filter(function (r) { return batch.indexOf(r) === -1; });
        var wasDone = !!lesson.completed;
        lesson = Object.assign({}, lesson, l);
        renderProgress();
        if (!wasDone && lesson.completed) loadList();
      })
      .catch(function () {
        // Best effort: these stretches go out again with the next report.
        batch.forEach(function (r) { r.sent = false; });
      })
      .then(function () {
        if (leaving) return;
        busy = false;
        if (!queued) return;
        var next = queued;
        queued = null;
        return send(next);
      });
  }

  function loadSdk() {
    return new Promise(function (resolve) {
      if (window.Stream) return resolve(true);
      var s = document.createElement('script');
      s.src = 'https://embed.cloudflarestream.com/embed/sdk.latest.js';
      s.onload = function () { resolve(!!window.Stream); };
      s.onerror = function () { resolve(false); };
      document.head.appendChild(s);
    });
  }

  function bindPlayerEvents() {
    var viewCounted = false;
    function onPlay() {
      if (playing) return;
      playing = true;
      reachedEnd = false;
      // Re-apply the chosen speed once playback starts (some players reset rate on load).
      setSpeed(preferredSpeed());
      openSeg();
      if (!viewCounted) {
        viewCounted = true;
        send({ viewStart: true });
      }
    }
    player.addEventListener('play', onPlay);
    player.addEventListener('playing', onPlay);
    player.addEventListener('seeking', function () { closeSeg(); });
    player.addEventListener('ratechange', function () {
      renderSpeed(player.playbackRate);
      try { localStorage.setItem(SPEED_KEY, String(clampSpeed(player.playbackRate))); } catch (e) {}
      if (!playing) return;
      // Credit what was played so far to the old speed, then continue at the new one.
      var at = seg ? seg.to : position();
      closeSeg();
      openSeg(at);
      send();
    });
    player.addEventListener('pause', function () {
      advance();
      playing = false;
      closeSeg();
      send();
    });
    player.addEventListener('ended', function () {
      advance();
      playing = false;
      reachedEnd = true;
      closeSeg();
      send({ ended: true });
    });
    player.addEventListener('timeupdate', function () {
      advance();
      if (playing && Date.now() - lastSentAt >= HEARTBEAT_MS) send();
    });
  }

  if ($('speedSlider')) {
    $('speedSlider').addEventListener('input', function () { setSpeed($('speedSlider').value); });
    renderSpeed(preferredSpeed());
  }

  function loadPlayer() {
    return api('/api/student/lms/lessons/' + encodeURIComponent(lessonId) + '/playback', {}, role).then(function (d) {
      lesson = d.lesson;
      document.title = lesson.title + ' — Salt Morning';
      $('titleText').textContent = lesson.title;
      $('lessonTitle').textContent = lesson.title;
      $('lessonDesc').textContent = lesson.description || '';
      var url = d.playerUrl + '?preload=auto' + (lesson.lastPosition > 5 && !lesson.completed ? '&startTime=' + lesson.lastPosition + 's' : '');
      $('playerArea').classList.remove('hidden');
      renderProgress();
      // Attach the SDK before setting iframe src so we do not miss its ready message
      // (otherwise playbackRate / play commands stay queued forever).
      return loadSdk().then(function (ok) {
        if (!ok) {
          if (lesson && !lesson.completed) $('manualArea').classList.remove('hidden');
          $('playerFrame').src = url;
          return;
        }
        player = window.Stream($('playerFrame'));
        bindPlayerEvents();
        $('speedRow').classList.remove('hidden');
        $('playerFrame').src = url;
        setSpeed(preferredSpeed());
      });
    }).catch(function (e) { showError(e.message || 'Could not open this lesson.'); });
  }

  function loadList() {
    return api('/api/student/lms/lessons', {}, role).then(function (d) {
      var list = d.toWatch ? d.toWatch.concat(d.watched || []) : (d.lessons || []);
      $('listHeading').classList.toggle('hidden', !list.length);
      $('emptyMsg').classList.toggle('hidden', !!list.length);
      $('lessonList').innerHTML = list.map(function (l, i) {
        var bits = [];
        if (l.durationSeconds) bits.push(fmt(l.durationSeconds));
        if (l.locked) bits.push('Opens ' + fmtWhen(l.availableFrom));
        else if (l.completed) bits.push('Completed');
        else {
          bits.push(l.percent ? l.percent + '% watched' : 'Not started');
          if (l.dueAt) bits.push((l.overdue ? 'Overdue — was due ' : 'Due ') + fmtWhen(l.dueAt));
        }
        var cls = (l.id === lessonId ? 'current' : '') + (l.locked ? ' locked' : '');
        return '<li><a' + (l.locked ? '' : ' href="/student-lesson.html?lesson=' + encodeURIComponent(l.id) + '"') +
          (cls.trim() ? ' class="' + cls.trim() + '"' : '') + '><span class="no">' + (i + 1) + '</span>' +
          '<span><div class="t">' + esc(l.title) + '</div><div class="m' + (l.overdue ? ' late' : '') + '">' + esc(bits.join(' · ')) + '</div></span>' +
          (l.completed ? '<span class="done"><i class="fa-solid fa-circle-check"></i></span>' : '<span></span>') +
          '</a></li>';
      }).join('');
    }).catch(function (e) { showError(e.message); });
  }

  $('markDoneBtn').addEventListener('click', function () {
    $('markDoneBtn').disabled = true;
    send({ manualDone: true }).then(function () { $('markDoneBtn').disabled = false; });
  });

  window.addEventListener('pagehide', function () {
    if (!player) return;
    advance();
    if (seg || pending.some(function (r) { return !r.sent; })) send(null, true);
  });

  if (lessonId) loadPlayer();
  loadList();
})();
</script>
</body>
</html>
