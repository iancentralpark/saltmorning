<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Parent — Salt Morning Class</title>
  <meta name="theme-color" content="#0D2748">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Salt Morning">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260818">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon.png?v=20260818">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20260818">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=20260818">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=20260818">
  <link rel="shortcut icon" href="/favicon.ico?v=20260818">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/app.css?v=20260708libs">
</head>
<body>
<div class="shell">
  <div id="loginView" class="card">
    <h2>Parent</h2>
    <p class="muted">Redirecting to sign in…</p>
    <p><a href="/">Go to login</a></p>
  </div>

  <div id="appView" class="hidden">
    <div class="topbar">
      <div class="brand" id="welcomeText">Parent</div>
      <button class="btn btn-ghost" id="logoutBtn" type="button">Log out</button>
    </div>
    <div id="tabAnnouncements" class="card">
      <div id="announceList"></div>
    </div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
<script src="/js/messenger.js?v=20260708libs"></script>
<script>
(function() {
  const role = 'parent';
  const { api, getToken, setToken, getProfile, setProfile, $, show, hide, escapeHtml } = SaltApp;

  async function loadAnnouncements() {
    const data = await api('/api/parent/announcements', {}, role);
    $('announceList').innerHTML = (data.announcements || []).map(a =>
      '<div style="margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)">' +
      '<strong>' + escapeHtml(a.title) + '</strong>' +
      '<div style="color:var(--muted);font-size:.8rem;margin:.25rem 0">' + escapeHtml(a.postedAt) + '</div>' +
      '<div>' + escapeHtml(a.body) + '</div></div>'
    ).join('') || '<p style="color:var(--muted)">No announcements yet.</p>';
  }

  $('logoutBtn').addEventListener('click', () => {
    setToken(role, ''); setProfile(role, null); location.href = '/';
  });

  function bootApp() {
    const p = getProfile(role);
    if (!p) return;
    hide($('loginView')); show($('appView'));
    $('welcomeText').textContent = 'Hi, ' + p.name;
    loadAnnouncements();
    SaltMessenger.init(role);
  }

  if (getToken(role)) bootApp();
  else location.replace('/');
})();
</script>
</body>
</html>
