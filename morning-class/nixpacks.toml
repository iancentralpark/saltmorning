# Node portal + Python OR-Tools solver in one Railway service.
# Use only the Node provider: adding the Python provider installs a second
# CPython that conflicts with python311 in nix-env (python3-embed.pc).
providers = ["node"]

[phases.install]
cmds = [
  "npm ci",
  "python3 -m venv solver/.venv",
  "solver/.venv/bin/pip install --upgrade pip",
  "solver/.venv/bin/pip install -r solver/requirements.txt"
]

[start]
cmd = "npm start"
